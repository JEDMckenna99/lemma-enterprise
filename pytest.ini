[tool:pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=lemma
    --cov-report=term-missing
    --cov-report=html:coverage_html
    --cov-fail-under=70
    --maxfail=10
    --durations=10

# Markers for test categorization
markers =
    security: marks tests as security-related (CSRF, auth, input validation)
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    slow: marks tests as slow running
    external: marks tests that require external dependencies
    optional: marks tests for optional features

# Filtering
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::urllib3.exceptions.InsecureRequestWarning

# Coverage options
[coverage:run]
source = lemma
omit = 
    tests/*
    */migrations/*
    */venv/*
    */virtualenv/*
    */.tox/*
    */site-packages/*
    setup.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod
