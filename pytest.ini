[pytest]
# Only collect the curated test suite. scripts/ contains operational helpers
# (e.g. run_full_gap_test.py) that define test_*-named functions making live
# network calls; they must not be collected as unit tests.
testpaths = tests
markers =
    unit: deterministic tests with no external network dependency
    integration: route-level tests with Flask test client and seeded state
    browser: wallet bridge and browser-flow contract tests
    live_didit: live Didit sandbox tests requiring external credentials and network access
    live: live end-to-end tests against a deployed staging app requiring external network access
    live_platform: live platform/wallet/billing smoke against deployed staging
    live_stripe: deprecated, Stripe Identity IDV removed; use live_didit
