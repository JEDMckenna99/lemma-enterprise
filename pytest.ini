[pytest]
markers =
    unit: deterministic tests with no external network dependency
    integration: route-level tests with Flask test client and seeded state
    browser: wallet bridge and browser-flow contract tests
    live_stripe: live Stripe sandbox tests requiring external credentials and network access
    live_didit: live didit sandbox tests requiring external credentials and network access
    live: live end-to-end tests against a deployed staging app requiring external network access
