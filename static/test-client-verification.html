<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client-Side Verification Test</title>
    <style>
        body {
            font-family: 'SF Pro', system-ui, -apple-system, sans-serif;
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f7fa;
        }
        .test-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin: 20px 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .test-result {
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            font-family: 'SF Mono', monospace;
            font-size: 13px;
        }
        .success { background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
        .error { background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }
        .info { background: #d1ecf1; color: #0c5460; border-left: 4px solid #17a2b8; }
        button {
            background: #0066cc;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            margin: 8px 0;
        }
        button:hover {
            background: #0052a3;
        }
        pre {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 6px;
            overflow-x: auto;
            font-size: 12px;
        }
        h2 {
            color: #2c3e50;
            border-bottom: 2px solid #0066cc;
            padding-bottom: 8px;
        }
    </style>
</head>
<body>
    <h1>🔐 Client-Side Verification Test</h1>
    <p>This page tests that the JavaScript message construction matches the Rust server.</p>

    <div class="test-card">
        <h2>Test 1: Issue & Verify Credential</h2>
        <button onclick="testIssueAndVerify()">Run Test</button>
        <div id="test1-result"></div>
    </div>

    <div class="test-card">
        <h2>Test 2: Message Construction Debug</h2>
        <button onclick="testMessageConstruction()">Run Test</button>
        <div id="test2-result"></div>
    </div>

    <div class="test-card">
        <h2>Test 3: Shield Verification</h2>
        <button onclick="testShieldVerification()">Run Test</button>
        <div id="test3-result"></div>
    </div>

    <!-- Load dependencies -->
    <script src="/static/js/lemma-message-construction.js"></script>
    <script src="/static/js/lemma-wasm-verifier-optimized.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@noble/ed25519@2.0.0/index.min.js"></script>

    <script>
        // Test 1: Issue credential on server, verify on client
        async function testIssueAndVerify() {
            const resultDiv = document.getElementById('test1-result');
            resultDiv.innerHTML = '<div class="info">Running test...</div>';

            try {
                // Step 1: Request server to issue a test credential
                resultDiv.innerHTML += '<div class="info">📤 Requesting test credential from server...</div>';
                
                const response = await fetch('/api/test/issue-credential', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        subject: 'did:lemma:test_user',
                        claims: {
                            packageType: 'permission',
                            siteDomain: window.location.hostname,
                            permissionId: 'test_read',
                            testField: 'test_value'
                        }
                    })
                });

                if (!response.ok) {
                    throw new Error(`Server returned ${response.status}: ${await response.text()}`);
                }

                const credential = await response.json();
                resultDiv.innerHTML += '<div class="success">✅ Received credential from server</div>';
                resultDiv.innerHTML += `<pre>${JSON.stringify(credential, null, 2)}</pre>`;

                // Step 2: Verify signature CLIENT-SIDE
                resultDiv.innerHTML += '<div class="info">🔐 Verifying signature client-side...</div>';
                
                const messageConstructor = new LemmaMessageConstructor();
                const message = await messageConstructor.createVerificationMessage(credential);
                
                resultDiv.innerHTML += `<div class="info">📝 Message hash (first 16 bytes): ${
                    Array.from(message.slice(0, 16))
                        .map(b => b.toString(16).padStart(2, '0'))
                        .join(' ')
                }</div>`;

                // Extract public key from DID
                const publicKeyHex = credential.issuer.replace('did:lemma:', '');
                const publicKey = hexToBytes(publicKeyHex);

                // Extract signature
                const signature = hexToBytes(credential.proof.signatureValue);

                // Verify using noble/ed25519
                const isValid = await window.nobleEd25519.verify(signature, message, publicKey);

                if (isValid) {
                    resultDiv.innerHTML += '<div class="success">✅ CLIENT-SIDE VERIFICATION PASSED!</div>';
                    resultDiv.innerHTML += '<div class="success">🎉 Message construction matches Rust server!</div>';
                } else {
                    resultDiv.innerHTML += '<div class="error">❌ CLIENT-SIDE VERIFICATION FAILED</div>';
                    resultDiv.innerHTML += '<div class="error">⚠️ Message construction does NOT match server!</div>';
                }

            } catch (error) {
                resultDiv.innerHTML += `<div class="error">❌ Test failed: ${error.message}</div>`;
                console.error(error);
            }
        }

        // Test 2: Debug message construction
        async function testMessageConstruction() {
            const resultDiv = document.getElementById('test2-result');
            resultDiv.innerHTML = '<div class="info">Running message construction debug...</div>';

            try {
                const testCredential = {
                    id: 'cred_test_12345',
                    issuer: 'did:lemma:' + '0'.repeat(64),
                    subject: 'did:lemma:test_subject',
                    issued_at: 1698765432,
                    expires_at: 1730301432,
                    claims: {
                        packageType: 'permission',
                        siteDomain: 'example.com',
                        permissionId: 'admin',
                        zField: 'last', // Tests alphabetical sorting
                        aField: 'first'
                    }
                };

                const messageConstructor = new LemmaMessageConstructor();
                const message = await messageConstructor.debugMessageConstruction(testCredential);

                resultDiv.innerHTML += '<div class="success">✅ Message constructed successfully</div>';
                resultDiv.innerHTML += '<div class="info">Check browser console for detailed breakdown</div>';

            } catch (error) {
                resultDiv.innerHTML += `<div class="error">❌ Test failed: ${error.message}</div>`;
                console.error(error);
            }
        }

        // Test 3: Test shield verification
        async function testShieldVerification() {
            const resultDiv = document.getElementById('test3-result');
            resultDiv.innerHTML = '<div class="info">Testing shield verification...</div>';

            try {
                if (!window.LemmaWASMVerifierOptimized) {
                    throw new Error('LemmaWASMVerifierOptimized not loaded');
                }

                const verifier = new LemmaWASMVerifierOptimized({ debug: true });
                await verifier.init();

                resultDiv.innerHTML += '<div class="success">✅ WASM verifier initialized</div>';

                // Request test credential
                const response = await fetch('/api/test/issue-credential', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        subject: 'did:lemma:test_user',
                        claims: {
                            packageType: 'permission',
                            siteDomain: window.location.hostname,
                            permissionId: 'test_read'
                        }
                    })
                });

                const credential = await response.json();
                resultDiv.innerHTML += '<div class="success">✅ Test credential issued</div>';

                // Verify using WASM verifier
                const result = await verifier.verify(credential);

                if (result.verified) {
                    resultDiv.innerHTML += '<div class="success">✅ WASM VERIFICATION PASSED!</div>';
                    resultDiv.innerHTML += `<div class="info">⚡ Time: ${result.verification_time_us?.toFixed(2)}µs</div>`;
                } else {
                    resultDiv.innerHTML += '<div class="error">❌ WASM VERIFICATION FAILED</div>';
                    resultDiv.innerHTML += `<div class="error">Reason: ${result.reason}</div>`;
                }

            } catch (error) {
                resultDiv.innerHTML += `<div class="error">❌ Test failed: ${error.message}</div>`;
                console.error(error);
            }
        }

        // Helper function
        function hexToBytes(hex) {
            const bytes = new Uint8Array(hex.length / 2);
            for (let i = 0; i < hex.length; i += 2) {
                bytes[i / 2] = parseInt(hex.substr(i, 2), 16);
            }
            return bytes;
        }
    </script>
</body>
</html>
