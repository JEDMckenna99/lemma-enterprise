<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3b82f6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Delay Log">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icons/metrics-192.png">
  <title>{% block title %}Delay Log{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/field-metrics.css') }}">
  {% block head %}{% endblock %}
</head>
<body class="field-app">
  <header class="field-header">
    <div class="field-header-top">
      <a href="/metrics/log" class="field-brand">Delay Log</a>
      <span id="offline-badge" class="offline-badge">Online</span>
    </div>
    <p class="field-sub">No package or customer data stored.</p>
    <nav class="field-nav">
      <a href="/metrics/start">Start</a>
      <a href="/metrics/log" class="active">Log</a>
      <a href="/metrics/summary">End</a>
      <a href="/metrics/report">Report</a>
    </nav>
  </header>
  <main class="field-main">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}
  <script src="{{ url_for('static', filename='js/metrics/storage.js') }}"></script>
  <script src="{{ url_for('static', filename='js/metrics/validate-client.js') }}"></script>
  <script src="{{ url_for('static', filename='js/metrics/aggregate-client.js') }}"></script>
  <script src="{{ url_for('static', filename='js/metrics/pwa.js') }}"></script>
  {% endblock %}
</body>
</html>
