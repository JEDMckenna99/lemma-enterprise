{% extends "metrics/base.html" %}
{% block title %}End Shift{% endblock %}
{% block content %}
<h1>End shift</h1>
<form id="summary-form" class="form-grid">
  <label>Total stops (count only)<input name="total_stops" type="number" min="0"></label>
  <label>Packages delivered (count only)<input name="total_packages" type="number" min="0"></label>
  <label>Shift length (hours)<input name="shift_length_hours" type="number" step="0.1" min="0"></label>
  <label>Battery end %<input name="battery_end" type="number" min="0" max="100"></label>
  <label>General notes<textarea name="notes" rows="3" placeholder="No addresses or IDs"></textarea></label>
  <button type="submit" class="btn primary">Save summary</button>
</form>
<button id="export-csv" class="btn big" style="width:100%;margin-top:1rem;">Export CSV</button>
{% endblock %}
{% block scripts %}
{{ super() }}
<script src="{{ url_for('static', filename='js/metrics/summary.js') }}"></script>
{% endblock %}
