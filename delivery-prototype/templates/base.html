<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Delivery Prototype{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <a href="/" class="brand">Delivery Prototype</a>
    {% if fake_data_only is not defined %}
    <span class="badge">Fake data only</span>
    {% elif fake_data_only %}
    <span class="badge">Fake data only</span>
    {% endif %}
    <nav>
      <a href="/metrics/log">Delay Log</a>
      <a href="/dispatch">Dispatch</a>
      <a href="/driver">Driver</a>
      <a href="/audit">Audit</a>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
