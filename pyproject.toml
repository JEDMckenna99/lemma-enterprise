[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lemmaid-cli"
version = "0.2.1"
description = "Lemma.id integration CLI"
readme = "docs/CLI_PYPI_README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  {name = "Lemma.id Team"},
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "requests>=2.31.0",
  "flask>=3.0.0",
]

[project.urls]
Homepage = "https://lemma.id"
Documentation = "https://lemma.id/docs/quickstart"
Repository = "https://github.com/JEDMckenna99/lemma-enterprise"

[project.scripts]
lemma = "scripts.lemma_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts", "api", "api.*"]
namespaces = true
