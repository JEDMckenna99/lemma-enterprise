[package]
name = "lemma-crypto"
version = "0.1.1"
edition = "2021"

[lib]
name = "lemma_crypto"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Core cryptography
curve25519-dalek = { version = "4.0", features = ["rand_core"] }
ed25519-dalek = { version = "2.0", features = ["rand_core", "batch"] }
sha2 = "0.10"
blake3 = "1.3"

# Bloom filters
bit-vec = "0.6"
fnv = "1.0"

# Python bindings
pyo3 = { version = "0.20", features = ["extension-module"], optional = true }
pythonize = { version = "0.20", optional = true }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Error handling
thiserror = "1.0"

# Logging
log = "0.4"

# UUID generation
uuid = { version = "1.0", features = ["v4"] }

# Random number generation
rand = "0.8"
getrandom = "0.2"

# Hex encoding/decoding
hex = "0.4"

# Memory mapping for zero-copy operations (not available in WebAssembly)
memmap2 = { version = "0.9", optional = true }

# Hardware acceleration
pkcs11 = { version = "0.5", optional = true }

# ZKP dependencies (not available in WebAssembly)
bulletproofs = { version = "4.0", optional = true }
merlin = { version = "3.0", optional = true }
ark-ec = { version = "0.4", optional = true }
ark-ff = { version = "0.4", optional = true }
ark-poly = { version = "0.4", optional = true }
ark-serialize = { version = "0.4", optional = true }
ark-std = { version = "0.4", optional = true }

# Additional ZKP systems (placeholder versions)
# Note: These are placeholders - actual implementations would use specific ZKP libraries
# plonk = "0.1"  # Placeholder for PLONK implementation
# groth16 = "0.1"  # Placeholder for Groth16 implementation

# Additional dependencies for Phase 3 & 4 (not available in WebAssembly)
num_cpus = { version = "1.0", optional = true }
fastrand = { version = "2.0", optional = true }
tokio = { version = "1.0", features = ["sync", "time"], optional = true }
crossbeam-channel = { version = "0.5", optional = true }
crossbeam-utils = { version = "0.8", optional = true }
lockfree = { version = "0.5", optional = true }
rayon = { version = "1.5", optional = true }
rustacuda = { version = "0.1", optional = true }
cudarc = { version = "0.10", optional = true }

# WebAssembly-compatible UUID and random generation
[target.wasm32-unknown-unknown.dependencies]
uuid = { version = "1.0", features = ["v4", "js"] }
getrandom = { version = "0.2", features = ["js"] }

# WebAssembly support
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }

# Testing
criterion = { version = "0.5", optional = true }

# QR code generation (for demo)
qrcode = { version = "0.14", optional = true }
image = { version = "0.25", optional = true }

[dependencies.web-sys]
version = "0.3"
optional = true
features = [
  "console",
  "Performance",
  "Window",
  "Document",
]

[dev-dependencies]
criterion = "0.5"
quickcheck = "1.0"
qrcode = "0.14"
image = "0.25"

# Removed benchmark and binary configurations for clean deployment

[features]
default = ["native"]
native = [
  "memmap2", 
  "num_cpus", 
  "fastrand", 
  "tokio", 
  "crossbeam-channel", 
  "crossbeam-utils", 
  "lockfree", 
  "rayon",
  "bulletproofs",
  "merlin",
  "ark-ec",
  "ark-ff",
  "ark-poly",
  "ark-serialize",
  "ark-std"
]
python = ["pyo3", "pythonize", "native"]
wasm = ["wasm-bindgen", "js-sys", "web-sys", "serde-wasm-bindgen"]
wasm-qr = ["wasm", "qrcode_gen"]
qr-verification = ["qrcode_gen"]
benchmark = ["criterion", "native"]
qrcode_gen = ["qrcode", "image"]
hsm = ["pkcs11"]
gpu = ["rustacuda", "cudarc"]
hardware_accel = ["hsm", "gpu"]

[build-dependencies]
pyo3-build-config = { version = "0.20", features = ["resolve-config"] }