name: ISHUMAN Live Stripe

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * *"

jobs:
  live-stripe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ISHUMAN_LIVE_BASE_URL: ${{ secrets.ISHUMAN_LIVE_BASE_URL }}
      ISHUMAN_LIVE_WALLET_ID: ${{ secrets.ISHUMAN_LIVE_WALLET_ID }}
      ISHUMAN_LIVE_WALLET_SECRET: ${{ secrets.ISHUMAN_LIVE_WALLET_SECRET }}
      ISHUMAN_LIVE_MASTER_CREDENTIAL_ID: ${{ secrets.ISHUMAN_LIVE_MASTER_CREDENTIAL_ID }}
      ISHUMAN_LIVE_TARGET_SITE: ${{ secrets.ISHUMAN_LIVE_TARGET_SITE }}
      ISHUMAN_LIVE_VERIFY_TIMEOUT_SECONDS: "420"
      ISHUMAN_LIVE_VERIFY_POLL_SECONDS: "5"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install live test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest requests

      - name: Run live Stripe issuance roundtrip tests
        run: >
          python -m pytest
          tests/live/test_ishuman_live_stripe_issue_flow.py
          -m "live_stripe"
          -v
