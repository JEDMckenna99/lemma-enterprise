name: ISHUMAN Issuance Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app.py"
      - "api/ishuman.py"
      - "api/ishuman_demo.py"
      - "api/revocation_api.py"
      - "api/bloom_snapshot.py"
      - "api/revocation_sync.py"
      - "api/ppid.py"
      - "api/identity_roots.py"
      - "api/identity_person.py"
      - "api/config.py"
      - "billing/stripe_manager.py"
      - "api/database.py"
      - "migrations/024_identity_roots.sql"
      - "static/js/ishuman-verifier.js"
      - "static/js/lemma-wallet.js"
      - "static/js/wallet-at-rest-crypto.js"
      - "static/js/lemma-passkey.js"
      - "api/passkey_auth.py"
      - "static/js/demo/ishuman-demo.js"
      - "templates/demo/ishuman.html"
      - "tests/conftest.py"
      - "tests/test_ishuman_*.py"
      - "tests/test_wallet_bridge_origin_enforcement.py"
      - "pytest.ini"
      - ".github/workflows/ishuman-issuance-tests.yml"
  push:
    branches:
      - main
    paths:
      - "app.py"
      - "api/ishuman.py"
      - "api/ishuman_demo.py"
      - "api/revocation_api.py"
      - "api/bloom_snapshot.py"
      - "api/revocation_sync.py"
      - "api/ppid.py"
      - "api/identity_roots.py"
      - "api/identity_person.py"
      - "api/config.py"
      - "billing/stripe_manager.py"
      - "api/database.py"
      - "migrations/024_identity_roots.sql"
      - "static/js/ishuman-verifier.js"
      - "static/js/lemma-wallet.js"
      - "static/js/wallet-at-rest-crypto.js"
      - "static/js/lemma-passkey.js"
      - "api/passkey_auth.py"
      - "static/js/demo/ishuman-demo.js"
      - "templates/demo/ishuman.html"
      - "tests/conftest.py"
      - "tests/test_ishuman_*.py"
      - "tests/test_wallet_bridge_origin_enforcement.py"
      - "pytest.ini"

jobs:
  ishuman-suite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest flask requests sqlalchemy stripe flask-cors psycopg2-binary redis cryptography

      - name: Run ISHUMAN issuance test suite (non-live)
        env:
          DATABASE_URL: "sqlite:///:memory:"
          LEMMA_PPID_ROOT_KEY: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          LEMMA_IDENTITY_ROOT_PEPPER_V1: yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy
          LEMMA_PERSON_ROOT_SALT_V1: zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz
        run: >
          python -m pytest
          tests/test_ishuman_network_regressions.py
          tests/test_identity_roots.py
          tests/test_ishuman_ppid_normalization.py
          tests/test_ishuman_person_root_derivation.py
          tests/test_ishuman_issuance_branching.py
          tests/test_ishuman_issuance_integration.py
          tests/test_ishuman_bloom_snapshot.py
          tests/test_wallet_bridge_origin_enforcement.py
          tests/test_ishuman_demo.py
          tests/test_site_ppid_revocation.py
          tests/test_wallet_prf_storage.py
          tests/test_ishuman_verifier_session_cache.py
          tests/test_issuer_trust_list.py
          -m "unit or integration or browser"
          -v
