name: Platform staging smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

jobs:
  platform-staging-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LEMMA_STAGING_BASE_URL: ${{ secrets.LEMMA_STAGING_BASE_URL }}
      LEMMA_STAGING_STRICT: "1"
      LEMMA_LIVE_TESTS_STRICT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required staging secrets
        run: |
          missing=0
          for name in LEMMA_STAGING_BASE_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} is required for platform staging smoke."
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: bash scripts/ci_install_test_deps.sh

      - name: Wait for staging deploy readiness
        env:
          LEMMA_BASE_URL: ${{ secrets.LEMMA_STAGING_BASE_URL }}
        run: python scripts/wait_for_deploy_health.py

      - name: Run wallet staging live smoke
        run: python -m pytest tests/live/test_wallet_staging_flow.py -m live_platform -v

      - name: Run platform staging live smoke
        run: python -m pytest tests/live/test_platform_staging_flow.py -m live_platform -v

      - name: Run billing staging live smoke
        run: python -m pytest tests/live/test_billing_staging_flow.py -m live_platform -v
