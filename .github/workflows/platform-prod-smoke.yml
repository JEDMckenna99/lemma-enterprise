name: Platform production smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "15 7 * * *"

jobs:
  platform-prod-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LEMMA_BASE_URL: https://lemma.id
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run non-destructive platform prod smoke
        run: python scripts/smoke_platform_prod.py
