name: Auth Launch Gate

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "20 13 * * *"

jobs:
  auth-launch-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LEMMA_BASE_URL: https://lemma.id
      LEMMA_PLATFORM_API_KEY: ${{ secrets.LEMMA_PLATFORM_API_KEY || secrets.LEMMA_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify required secret
        run: |
          if [ -z "${LEMMA_PLATFORM_API_KEY}" ]; then
            echo "LEMMA_PLATFORM_API_KEY or LEMMA_API_KEY secret is required for strict auth launch gate."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: bash scripts/ci_install_test_deps.sh

      - name: Run local security gates
        env:
          SESSION_SECRET: test-session-secret
          DATABASE_URL: "sqlite:///:memory:"
        run: |
          python -m pytest tests/test_csp_security.py -q
          python scripts/generate_auth_scope_matrix.py
          python scripts/check_authority_operations.py
          python scripts/check_ishuman_protocol_registry.py
          python -m pytest tests/test_authority_operations_contract.py -q
          python -m pytest tests/test_ishuman_protocol_registry.py tests/test_cryptographic_invariants.py -q
          python scripts/review_auth_scope_matrix.py --strict-state-changing

      - name: Wait for production deploy readiness
        run: python scripts/wait_for_deploy_health.py

      - name: Run strict post-deploy launch gate bundle
        shell: pwsh
        run: >
          ./scripts/post_deploy_launch_gate.ps1
          -BaseUrl "$env:LEMMA_BASE_URL"
          -OutputDir "ops/evidence/launch"
          -PlatformApiKey "$env:LEMMA_PLATFORM_API_KEY"
          -StrictScopePolicy
          -RequirePlatformApiKey

      - name: Upload launch evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-launch-gate-evidence
          path: ops/evidence/launch/*
