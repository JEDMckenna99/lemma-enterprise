# DEPRECATED: superseded by Auth Launch Gate post-deploy
# (scripts/post_deploy_launch_gate.ps1 → launch_gate_smoke_ci.py → smoke_platform_prod.py)
# and the daily Platform production smoke canary.
# Kept as manual-only so historical bookmarks still resolve.
name: Launch Gate Smoke

on:
  workflow_dispatch:

jobs:
  launch-gate-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run non-destructive launch-gate smoke checks
        env:
          LEMMA_BASE_URL: https://lemma.id
        run: python scripts/smoke_platform_prod.py
