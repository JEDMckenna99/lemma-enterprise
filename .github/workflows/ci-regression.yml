name: CI Regression

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: bash scripts/ci_install_test_deps.sh

      - name: Install coverage tooling
        run: python -m pip install pytest-cov

      - name: Run non-live regression suite
        env:
          SESSION_SECRET: test-session-secret
          DATABASE_URL: "sqlite:///:memory:"
          LEMMA_PPID_ROOT_KEY: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          LEMMA_IDENTITY_ROOT_PEPPER_V1: yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy
          LEMMA_PERSON_ROOT_SALT_V1: zzzzzzzzzzzzzzzzzzzzzzzzzzzzzzzz
        run: python scripts/ci_regression_suite.py
