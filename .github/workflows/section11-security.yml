name: Section 11 Security Gates

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  dependency-scan:
    name: Dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: pip-audit (requirements.txt)
        run: pip-audit -r requirements.txt

      - name: npm audit (proof-verifier-js)
        working-directory: packages/proof-verifier-js
        run: |
          npm i --package-lock-only
          npm audit --audit-level=high

      - name: npm audit (cdn production deps)
        working-directory: cdn
        run: |
          npm ci --omit=dev || npm install --omit=dev
          npm audit --omit=dev --audit-level=high

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bandit (high severity only)
        run: |
          python -m pip install bandit
          bandit -r api -lll -c .bandit.yml

  # Coverage gate lives in ci-regression.yml (pytest --cov-fail-under=40)
  # to avoid running the full non-live suite twice on every PR/main push.
