name: proof-verifier-release

on:
  push:
    tags:
      - "proof-verifier-v*"
      - "ishuman-verify-v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync verifier mirrors
        run: python scripts/sync_proof_verifier_packages.py --check

      - name: Section 10 unit tests
        run: |
          pip install -r requirements.txt
          pip install pytest cryptography
          python -m pytest tests/test_sdk_integration_section10.py tests/test_ishuman_verify_packages.py -q

      - name: Build Python package
        working-directory: packages/proof-verifier-py
        run: pip install build && python -m build

      - name: Publish npm package
        working-directory: packages/proof-verifier-js
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN secret not configured; skipping npm publish"
            exit 0
          fi
          npm publish --access public

      - name: Publish PyPI package
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "${TWINE_PASSWORD:-}" ]; then
            echo "PYPI_API_TOKEN secret not configured; skipping PyPI publish"
            exit 0
          fi
          pip install twine
          twine upload packages/proof-verifier-py/dist/*

      - name: Release summary
        run: |
          echo "Tag or dispatch: ${{ github.ref_name }}"
          echo "Configure NPM_TOKEN and PYPI_API_TOKEN for live registry publish."
