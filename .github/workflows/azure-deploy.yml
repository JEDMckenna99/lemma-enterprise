name: Deploy to Azure

on:
  push:
    branches:
      - main  # Change this to your main branch name if different (e.g., master)
  workflow_dispatch:  # Allows manual triggering from GitHub UI

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v2
      
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Create deployment package
      run: |
        mkdir -p deployment_package
        cp -r * deployment_package/ || true
        cd deployment_package
        rm -rf .git .github __pycache__ .pytest_cache .vscode venv env .env
        cd ..
        zip -r lemma-enterprise.zip deployment_package
      
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: lemma-enterprise.zip
