version: '3'

services:
  lemma:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - lemma_data:/data/.lemma_enterprise
    environment:
      - LEMMA_ADMIN_USER=admin
      - LEMMA_ADMIN_PASS=secure_password_change_me
      - LEMMA_SECRET_KEY=your_secret_key_here
      - LEMMA_API_KEY=your_api_key_here
    restart: unless-stopped

volumes:
  lemma_data:
    driver: local
