<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lemma Wallet Bridge</title>
    <!-- This page is loaded in an iframe by third-party sites to access the central wallet -->
</head>
<body>
<script src="/static/js/lemma-wallet.js"></script>
<script>
/**
 * Lemma Wallet Bridge
 * 
 * This iframe provides cross-origin access to the user's Lemma wallet.
 * Third-party sites can communicate via postMessage to:
 * - Store credentials issued by their site
 * - Check if wallet is unlocked
 * - Request wallet unlock (user interaction required)
 * 
 * Security:
 * - Origin validation for all messages
 * - Only allows credential storage, not arbitrary data
 * - Credentials must be properly signed
 */

// ============================================
// ORIGIN VALIDATION - PURELY CLIENT-SIDE
// ============================================
// 
// SECURITY MODEL: Per-site credential filtering is the PRIMARY protection.
// Each site can ONLY see credentials issued for their domain.
// No server calls needed - the bridge is just a window into IndexedDB.
//
// Origin validation is SECONDARY - we allow any HTTPS origin to connect,
// but they can only access their own credentials (enforced in each handler).

/**
 * Check if origin is allowed - PURELY CLIENT-SIDE, NO SERVER CALLS
 * 
 * The real security is per-site credential filtering in each message handler.
 * This just does basic sanity checks (HTTPS required for production).
 */
function isOriginAllowed(origin) {
    // Allow Lemma infrastructure
    if (origin === 'https://lemma.id' || 
        origin === 'https://lemma-enterprise-0f6ba17076c1.herokuapp.com') {
        return true;
    }
    
    // Allow localhost for development
    if (origin.includes('localhost') || origin.includes('127.0.0.1')) {
        return true;
    }
    
    // Production: require HTTPS
    // The per-site credential filtering in each handler is the real protection
    if (origin.startsWith('https://')) {
        return true;
    }
    
    console.warn(`🔒 Rejected non-HTTPS origin: ${origin}`);
    return false;
}

let wallet = null;

// Initialize wallet
async function initWallet() {
    try {
        // Wait for LemmaWallet to be available
        let attempts = 0;
        while (typeof LemmaWallet === 'undefined' && attempts < 50) {
            await new Promise(r => setTimeout(r, 100));
            attempts++;
        }
        
        if (typeof LemmaWallet === 'undefined') {
            console.error('❌ LemmaWallet not loaded');
            return false;
        }
        
        wallet = window.globalLemmaWallet || new LemmaWallet({ debug: true });
        await wallet.init();
        console.log('✅ Wallet bridge initialized');
        return true;
    } catch (e) {
        console.error('❌ Wallet init failed:', e);
        return false;
    }
}

// Handle incoming messages from parent/opener windows
window.addEventListener('message', async (event) => {
    const origin = event.origin;
    
    // Basic origin validation (client-side only, no server call)
    // Real security is per-site credential filtering in each handler
    if (!isOriginAllowed(origin)) {
        console.warn('⚠️ Message from unauthorized origin:', origin);
        return;
    }
    
    const { type, payload, requestId } = event.data || {};
    
    if (!type) return;
    
    console.log(`📨 Bridge received: ${type} from ${origin}`);
    
    // Helper to send response back
    const respond = (data) => {
        event.source.postMessage({
            type: `${type}_response`,
            requestId,
            ...data
        }, origin);
    };
    
    try {
        switch (type) {
            case 'WALLET_PING':
                // Health check
                respond({ success: true, ready: !!wallet });
                break;
                
            case 'WALLET_INIT':
                // Initialize wallet
                const initResult = await initWallet();
                respond({ success: initResult });
                break;
                
            case 'WALLET_STATUS':
                // Get wallet status
                if (!wallet) await initWallet();
                const info = await wallet.getWalletInfo();
                respond({
                    success: true,
                    isUnlocked: info.isUnlocked,
                    hasPasskey: info.hasPasskey,
                    credentialCount: info.credentialCount || 0
                });
                break;
                
            case 'WALLET_UNLOCK':
                // Request wallet unlock (requires user interaction)
                if (!wallet) await initWallet();
                try {
                    const unlocked = await wallet.unlock();
                    respond({ success: unlocked });
                } catch (e) {
                    respond({ success: false, error: e.message });
                }
                break;
                
            case 'STORE_CREDENTIAL':
                // Store a credential in the wallet
                if (!wallet) await initWallet();
                
                const credential = payload?.credential;
                if (!credential) {
                    respond({ success: false, error: 'No credential provided' });
                    return;
                }
                
                // Validate credential has required fields
                if (!credential.id || !credential.issuer) {
                    respond({ success: false, error: 'Invalid credential format' });
                    return;
                }
                
                // SECURITY: Extract requesting site for validation
                let storingSite;
                try {
                    storingSite = new URL(origin).hostname.toLowerCase().replace(/^www\./, '');
                } catch (e) {
                    respond({ success: false, error: 'Invalid origin' });
                    return;
                }
                
                // SECURITY: Validate credential's siteId matches the requesting origin
                // This prevents malicious sites from storing fake credentials for other sites
                const credClaims = credential.claims || credential.credentialSubject || {};
                const credSiteId = (credClaims.siteId || credClaims.site_id || '').toLowerCase().replace(/^www\./, '');
                
                if (credSiteId && credSiteId !== storingSite && 
                    !storingSite.endsWith('.' + credSiteId) && 
                    !credSiteId.endsWith('.' + storingSite)) {
                    console.warn(`🔒 Blocked: ${storingSite} tried to store credential for ${credSiteId}`);
                    respond({ success: false, error: 'Cannot store credentials for other sites' });
                    return;
                }
                
                // Ensure packageType is set for proper filtering
                credential.packageType = credential.packageType || 'permission';
                
                // Store the credential
                const storeResult = await wallet.storeCredential(credential);
                console.log(`✅ Credential stored via bridge for ${storingSite}:`, credential.id);
                
                respond({
                    success: true,
                    credentialId: credential.id,
                    stored: true
                });
                break;
                
            case 'GET_CREDENTIALS':
                // Get credentials - SECURITY: Only return credentials for the requesting origin
                if (!wallet) await initWallet();
                
                const filterType = payload?.type || null;
                
                // Extract requesting site's hostname for security filtering
                let requestingSite;
                try {
                    requestingSite = new URL(origin).hostname;
                } catch (e) {
                    respond({ success: false, error: 'Invalid origin' });
                    return;
                }
                
                let credentials = await wallet.getCredentials(filterType);
                
                // SECURITY FIX: Only return credentials issued for the requesting site
                // This prevents cross-site credential leakage while preserving the
                // "traveling wallet" experience - each site sees only their own credentials
                credentials = credentials.filter(c => {
                    const claims = c.claims || c.credentialSubject || {};
                    const credSiteId = claims.siteId || claims.site_id || '';
                    
                    // Normalize both for comparison
                    const normalizedCredSite = credSiteId.toLowerCase().replace(/^www\./, '');
                    const normalizedRequestingSite = requestingSite.toLowerCase().replace(/^www\./, '');
                    
                    // Match: exact domain, subdomain of credential site, or credential is subdomain
                    return normalizedCredSite === normalizedRequestingSite ||
                           normalizedRequestingSite.endsWith('.' + normalizedCredSite) ||
                           normalizedCredSite.endsWith('.' + normalizedRequestingSite);
                });
                
                console.log(`🔒 Returning ${credentials.length} credentials for ${requestingSite}`);
                
                respond({
                    success: true,
                    credentials: credentials,
                    count: credentials.length,
                    filteredFor: requestingSite
                });
                break;
                
            case 'VERIFY_CREDENTIAL':
                // Verify a credential locally
                if (!wallet) await initWallet();
                
                const credToVerify = payload?.credential;
                if (!credToVerify) {
                    respond({ success: false, error: 'No credential provided' });
                    return;
                }
                
                const verification = await wallet.verifyCredential(credToVerify);
                respond({
                    success: true,
                    valid: verification.valid,
                    reason: verification.reason
                });
                break;
                
            case 'REMOVE_CREDENTIAL':
                // Remove a credential - SECURITY: Only allow removing own credentials
                if (!wallet) await initWallet();
                
                const credId = payload?.credentialId;
                if (!credId) {
                    respond({ success: false, error: 'No credentialId provided' });
                    return;
                }
                
                // SECURITY: Extract requesting site
                let removingSite;
                try {
                    removingSite = new URL(origin).hostname.toLowerCase().replace(/^www\./, '');
                } catch (e) {
                    respond({ success: false, error: 'Invalid origin' });
                    return;
                }
                
                // SECURITY: Fetch the credential and verify it belongs to the requesting site
                const allCreds = await wallet.getCredentials();
                const credToRemove = allCreds.find(c => c.id === credId);
                
                if (credToRemove) {
                    const removeClaims = credToRemove.claims || credToRemove.credentialSubject || {};
                    const removeSiteId = (removeClaims.siteId || removeClaims.site_id || '').toLowerCase().replace(/^www\./, '');
                    
                    if (removeSiteId && removeSiteId !== removingSite &&
                        !removingSite.endsWith('.' + removeSiteId) &&
                        !removeSiteId.endsWith('.' + removingSite)) {
                        console.warn(`🔒 Blocked: ${removingSite} tried to remove credential for ${removeSiteId}`);
                        respond({ success: false, error: 'Cannot remove credentials for other sites' });
                        return;
                    }
                }
                
                await wallet.removeCredential(credId);
                console.log(`✅ Credential removed via bridge for ${removingSite}:`, credId);
                respond({ success: true, removed: true });
                break;
                
            default:
                respond({ success: false, error: `Unknown message type: ${type}` });
        }
        
    } catch (error) {
        console.error(`❌ Bridge error handling ${type}:`, error);
        respond({ success: false, error: error.message });
    }
});

// Initialize on load - NO SERVER CALLS
// The bridge is purely client-side, accessing lemma.id's IndexedDB
(async function() {
    // Initialize wallet (opens IndexedDB - no server call)
    const ready = await initWallet();
    console.log('🌉 Wallet bridge ready:', ready);
    
    // Notify parent that bridge is ready
    if (window.parent !== window) {
        window.parent.postMessage({
            type: 'WALLET_BRIDGE_READY',
            ready: ready
        }, '*');
    }
})();
</script>
</body>
</html>
