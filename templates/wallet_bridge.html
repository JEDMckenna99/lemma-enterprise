<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lemma Wallet Bridge</title>
    <!-- 
        Lemma Wallet Bridge v2.0
        
        This page is loaded in an iframe by third-party sites to access the central wallet.
        CACHE POLICY: This HTML should be cached aggressively (1 year, immutable).
        
        LOCAL-FIRST DESIGN:
        - NO server calls for verification
        - Session stored in IndexedDB (lemma.id origin)
        - Credentials verified via Ed25519 (local WebCrypto)
        - 35x fewer network calls than traditional auth
    -->
</head>
<body>
<script src="/static/js/lemma-wallet.js?v=2473" nonce="{{ csp_nonce }}"></script>
<script nonce="{{ csp_nonce }}">
/**
 * Lemma Wallet Bridge v2.0
 * 
 * LOCAL-FIRST AUTHENTICATION
 * 
 * This bridge enables cross-site wallet access with ZERO network calls for verification:
 * 
 * NETWORK CALLS COMPARISON:
 * ┌────────────────────────┬─────────────┬─────────────┐
 * │ Operation              │ Auth0       │ Lemma       │
 * ├────────────────────────┼─────────────┼─────────────┤
 * │ Page load              │ 1-2 calls   │ 0 (cached)  │
 * │ Session check          │ 1 call      │ 0 (IndexedDB)│
 * │ Token refresh          │ 1 call/hr   │ 0 (local)   │
 * │ Credential verify      │ 1 call      │ 0 (Ed25519) │
 * └────────────────────────┴─────────────┴─────────────┘
 * 
 * SECURITY MODEL:
 * 1. HTTPS required (except localhost)
 * 2. Per-site credential isolation (sites only see their own credentials)
 * 3. Session-gated write operations
 * 4. Passkey protects wallet unlock
 */

// ============================================
// SESSION CONFIGURATION
// ============================================

const SESSION_CONFIG = {
    DEFAULT_DURATION: 24 * 60 * 60 * 1000,  // 24 hours
    EXTEND_THRESHOLD: 2 * 60 * 60 * 1000,   // Auto-prompt extend if < 2 hours left
    MAX_EXTENSIONS: 7,                       // Max 7 extensions (7 days total without full re-auth)
    EXTEND_DURATION: 24 * 60 * 60 * 1000    // Each extension adds 24 hours
};

// ============================================
// ORIGIN VALIDATION - PURELY CLIENT-SIDE
// ============================================

/**
 * Check if origin is allowed - PURELY CLIENT-SIDE, NO SERVER CALLS
 * 
 * The real security is per-site credential filtering in each message handler.
 * This just does basic sanity checks (HTTPS required for production).
 */
function isOriginAllowed(origin) {
    // Allow Lemma infrastructure (exact match)
    if (origin === 'https://lemma.id' ||
        origin === 'https://www.lemma.id') {
        return true;
    }

    // Parse origin to validate properly
    let parsedOrigin;
    try {
        parsedOrigin = new URL(origin);
    } catch (e) {
        console.warn(` Rejected invalid origin: ${origin}`);
        return false;
    }

    // Allow localhost for development (strict hostname check, not substring match)
    // SECURITY: Must check hostname exactly, not origin.includes() which matches evil-localhost.com
    const hostname = parsedOrigin.hostname;
    if (hostname === 'localhost' || hostname === '127.0.0.1') {
        return true;
    }

    // Production: require HTTPS
    // NOTE: Per-site credential filtering provides the real security - each site
    // can only access its own credentials. This HTTPS check is defense-in-depth.
    if (parsedOrigin.protocol === 'https:') {
        return true;
    }

    console.warn(` Rejected non-HTTPS origin: ${origin}`);
    return false;
}

/**
 * Extract and normalize hostname from origin
 */
function getHostnameFromOrigin(origin) {
    try {
        return new URL(origin).hostname.toLowerCase().replace(/^www\./, '');
    } catch (e) {
        return null;
    }
}

function isLemmaInfrastructureSite(site) {
    if (!site) return false;
    const normalized = site.toLowerCase();
    return normalized === 'lemma.id' || normalized.endsWith('.lemma.id');
}

// ============================================
// WALLET & SESSION MANAGEMENT
// ============================================

let wallet = null;
let storageAccessGranted = false;
const walletSecureModeEnabled = (() => {
    try {
        const params = new URLSearchParams(window.location.search || '');
        if (params.get('wallet_secure_mode') === '1') return true;
        return localStorage.getItem('lemma_wallet_secure_mode') === 'true';
    } catch (_) {
        return false;
    }
})();

// ============================================
// MICRO-CACHE (speed: avoid repeated IndexedDB)
// ============================================

const CACHE_CONFIG = {
    sessionTtlMs: 2000,
    credentialsTtlMs: 5000
};

const cache = {
    session: { value: null, ts: 0, promise: null },
    credentials: new Map(),
    credentialsPromises: new Map()
};

function isFresh(ts, ttl) {
    return Date.now() - ts < ttl;
}

function clearCredentialsCache() {
    cache.credentials.clear();
    cache.credentialsPromises.clear();
}

function getCredentialSiteBinding(claims) {
    const normalizeHost = (value) => String(value || '').toLowerCase().replace(/^www\./, '').trim();
    const siteDomain = normalizeHost(
        claims?.siteDomain ||
        claims?.site_domain ||
        claims?.domain
    );
    if (siteDomain) return siteDomain;

    const siteId = normalizeHost(claims?.siteId || claims?.site_id || '');
    if (!siteId) return '';
    return siteId;
}

function normalizeCredentialRecord(record) {
    if (!record || typeof record !== 'object') return record;
    const pickRichClaims = (...candidates) => {
        const normalized = candidates.map(c => (c && typeof c === 'object') ? c : {});
        const score = (obj) => {
            let s = 0;
            if (Object.keys(obj).length > 0) s += 1;
            if (obj.permissionId || obj.permission_level || obj.permission_id) s += 2;
            if (obj.accountType || obj.account_type) s += 2;
            if (obj.siteId || obj.site_id || obj.siteDomain || obj.site_domain) s += 2;
            if (obj.scope || obj.permissions) s += 1;
            return s;
        };
        return normalized.sort((x, y) => score(y) - score(x))[0] || {};
    };
    const nested = (record.credential && typeof record.credential === 'object')
        ? record.credential
        : ((record.lemma && typeof record.lemma === 'object')
            ? record.lemma
            : ((record.payload?.credential && typeof record.payload.credential === 'object')
                ? record.payload.credential
                : ((record.data?.credential && typeof record.data.credential === 'object')
                    ? record.data.credential
                    : null)));
    const base = nested ? { ...record, ...nested } : { ...record };
    const claims = pickRichClaims(
        base.claims,
        base.credentialSubject,
        nested?.claims,
        nested?.credentialSubject,
        base.payload?.claims,
        base.payload?.credentialSubject
    );
    const credentialSubject = pickRichClaims(
        base.credentialSubject,
        base.claims,
        nested?.credentialSubject,
        nested?.claims,
        base.payload?.credentialSubject,
        base.payload?.claims
    );
    return {
        ...base,
        claims,
        credentialSubject,
        packageType: base.packageType || claims.packageType || credentialSubject.packageType || base.type?.[1] || null
    };
}

function updateSessionCache(value) {
    cache.session.value = value;
    cache.session.ts = Date.now();
}

/**
 * Request unpartitioned storage access (needed for cross-site wallet)
 * Modern browsers partition third-party storage by default.
 * We need to request access to the REAL lemma.id storage.
 */
async function requestStorageAccess() {
    // Check if we're in an iframe (third-party context)
    const isThirdParty = window.self !== window.top;
    
    if (!isThirdParty) {
        // First-party context - no need to request
        storageAccessGranted = true;
        return true;
    }
    
    // Check if Storage Access API is available
    if (!document.hasStorageAccess) {
        console.warn(' Storage Access API not available - storage may be partitioned');
        return false;
    }
    
    try {
        // Check if we already have access
        const hasAccess = await document.hasStorageAccess();
        if (hasAccess) {
            console.log(' Storage access already granted');
            storageAccessGranted = true;
            return true;
        }
        
        // Request access - this may require user gesture in some browsers
        // Chrome: automatic if user has visited lemma.id recently
        // Safari: requires user interaction
        // Firefox: requires user interaction
        await document.requestStorageAccess();
        console.log(' Storage access granted via API');
        storageAccessGranted = true;
        return true;
    } catch (e) {
        console.warn(' Storage access denied:', e.message);
        console.warn('   User may need to click to grant access');
        return false;
    }
}

/**
 * Request storage access with user gesture (for browsers that require it)
 * This is called when parent sends REQUEST_STORAGE_ACCESS message
 */
async function requestStorageAccessWithGesture() {
    if (!document.requestStorageAccess) {
        return { success: false, error: 'Storage Access API not available' };
    }
    
    try {
        await document.requestStorageAccess();
        storageAccessGranted = true;
        
        // Re-initialize wallet with new storage access
        wallet = null;
        await initWallet();
        
        // Check session with new access
        const session = await checkSession();
        
        return {
            success: true,
            storageAccess: 'unpartitioned',
            session: session
        };
    } catch (e) {
        return { success: false, error: e.message };
    }
}

/**
 * Initialize wallet - opens IndexedDB, NO server calls
 */
async function initWallet() {
    try {
        // Request storage access first (for cross-site usage)
        await requestStorageAccess();
        
        let attempts = 0;
        while (typeof LemmaWallet === 'undefined' && attempts < 50) {
            await new Promise(r => setTimeout(r, 100));
            attempts++;
        }
        
        if (typeof LemmaWallet === 'undefined') {
            console.error(' LemmaWallet not loaded');
            return false;
        }
        
        wallet = window.globalLemmaWallet || new LemmaWallet({ debug: true });
        await wallet.init();
        console.log(' Wallet bridge initialized (v2.0 - local-first)');
        console.log('   Storage access:', storageAccessGranted ? 'unpartitioned' : 'partitioned');
        return true;
    } catch (e) {
        console.error(' Wallet init failed:', e);
        return false;
    }
}

// Track last server sync to avoid excessive calls
let lastServerSync = 0;
const SERVER_SYNC_INTERVAL = 30000; // Check server every 30 seconds

/**
 * Check session validity - syncs with server cookie to detect remote locks
 * Returns detailed session state for cross-site session sharing
 */
async function checkSession(options = {}) {
    if (!wallet) await initWallet();
    
    try {
        if (!options.force && cache.session.value && isFresh(cache.session.ts, CACHE_CONFIG.sessionTtlMs)) {
            return cache.session.value;
        }
        if (!options.force && cache.session.promise) {
            return await cache.session.promise;
        }

        cache.session.promise = (async () => {
        // First check local IndexedDB
        let session = await wallet._get('session', 'current');
        
        // IMPORTANT: Periodically sync with server to catch remote locks
        // This handles the case where user locks on lemma.id but bridge has stale data
        const now = Date.now();
        const shouldSyncServer = (now - lastServerSync) > SERVER_SYNC_INTERVAL;
        
        if (shouldSyncServer) {
            lastServerSync = now;
            try {
                console.log(' Checking server session cookie...');
                const response = await fetch('/api/wallet/session-sync', {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' }
                });
                const data = await response.json();
                console.log(' Server response:', response.status, data.success ? 'valid' : data.error);
                
                // API returns {success: true, session: {...}} when valid
                // API returns {success: false, error: 'no_session'|'session_expired'} when invalid
                if (response.ok && data.success && data.session) {
                    // Server says session is valid
                    console.log(' Server session confirmed valid');
                    
                    // If local is missing/stale, restore from server
                    if (!session || session.expiresAt < data.session.expires_at * 1000) {
                        session = {
                            id: 'current',
                            isUnlocked: true,
                            unlockedAt: data.session.unlocked_at,
                            expiresAt: data.session.expires_at * 1000,
                            walletId: data.session.wallet_id,
                            source: 'server_sync'
                        };
                        await wallet._put('session', session);
                        console.log(' Local session restored from server');
                    }
                } else if (session) {
                    // Server returned no valid cookie session but local session exists.
                    // Disambiguate "cookies blocked" vs "user really locked":
                    // verify global session state by wallet_id (cookie-independent).
                    console.log('ℹ Session-sync returned non-valid result; checking global-session state...');
                    let globalValid = true;
                    try {
                        const walletId = session.walletId || (await wallet._get('passkey', 'walletId'))?.value;
                        if (walletId) {
                            const globalResp = await fetch('/api/wallet/global-session', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ wallet_id: walletId })
                            });
                            const globalData = await globalResp.json().catch(() => ({}));
                            globalValid = !!(globalResp.ok && globalData.success && globalData.valid === true);
                            console.log('ℹ Global-session check:', globalValid ? 'valid' : 'invalid');
                        }
                    } catch (globalErr) {
                        console.warn('Global-session disambiguation failed:', globalErr.message);
                        // Conservative for UX: if check fails, keep local session for now.
                        globalValid = true;
                    }

                    if (!globalValid) {
                        console.log(' Session invalidated globally - clearing local bridge session');
                        try {
                            await wallet._delete('session', 'current');
                        } catch (e) {}
                        cache.session = { value: null, ts: 0, promise: null };

                        if (window.parent !== window) {
                            window.parent.postMessage({
                                type: 'SESSION_INVALIDATED',
                                reason: 'global_session_invalid',
                                walletId: session.walletId || null,
                                timestamp: Date.now(),
                                instant: false
                            }, '*');
                        }

                        session = null;
                    } else {
                        console.log('ℹ Keeping local session (cookie/session-sync unavailable but global session still valid)');
                    }
                } else {
                    console.log('ℹ No server session and no local session');
                }
            } catch (e) {
                console.warn('Server sync failed (offline?):', e.message);
                // Continue with local session if server unreachable
            }
        }
        
        if (!session) {
            const result = { 
                valid: false, 
                reason: 'no_session',
                walletExists: !!(await wallet._get('passkey', 'primary'))
            };
            updateSessionCache(result);
            return result;
        }
        
        if (session.expiresAt < now) {
            const result = { 
                valid: false, 
                reason: 'expired',
                expiredAt: session.expiresAt,
                expiredAgo: now - session.expiresAt,
                walletExists: true
            };
            updateSessionCache(result);
            return result;
        }
        
        const timeRemaining = session.expiresAt - now;
        const extensionCount = session.extensionCount || 0;
        
        const result = {
            valid: true,
            expiresAt: session.expiresAt,
            timeRemaining,
            unlockedAt: session.unlockedAt,
            extensionCount,
            canExtend: extensionCount < SESSION_CONFIG.MAX_EXTENSIONS,
            shouldPromptExtend: timeRemaining < SESSION_CONFIG.EXTEND_THRESHOLD,
            walletExists: true
        };
        updateSessionCache(result);
        return result;
        })();

        const result = await cache.session.promise;
        return result;
    } catch (e) {
        console.error('Session check error:', e);
        return { valid: false, reason: 'error', error: e.message };
    } finally {
        cache.session.promise = null;
    }
}

/**
 * Extend session with reduced friction (tap only, no full biometric)
 * Only allowed if under MAX_EXTENSIONS limit
 */
async function extendSession() {
    if (!wallet) await initWallet();
    
    try {
        const session = await wallet._get('session', 'current');
        
        if (!session) {
            return { success: false, reason: 'no_session' };
        }
        
        const extensionCount = session.extensionCount || 0;
        
        if (extensionCount >= SESSION_CONFIG.MAX_EXTENSIONS) {
            return { 
                success: false, 
                reason: 'max_extensions_reached',
                message: 'Full re-authentication required after 7 days'
            };
        }
        
        // Get passkey for reduced-friction auth
        const passkey = await wallet._get('passkey', 'primary');
        if (!passkey) {
            return { success: false, reason: 'no_passkey' };
        }
        
        // Request user presence (tap only, not full biometric)
        try {
            const credential = await navigator.credentials.get({
                publicKey: {
                    challenge: crypto.getRandomValues(new Uint8Array(32)),
                    rpId: window.location.hostname,
                    allowCredentials: [{
                        id: wallet._base64urlToBuffer(passkey.credentialId),
                        type: 'public-key'
                    }],
                    userVerification: 'discouraged',  // Tap only
                    timeout: 30000
                }
            });
            
            if (!credential) {
                return { success: false, reason: 'user_cancelled' };
            }
        } catch (e) {
            return { success: false, reason: 'auth_failed', error: e.message };
        }
        
        // Extend session
        const now = Date.now();
        const newExpiry = now + SESSION_CONFIG.EXTEND_DURATION;
        
        const updatedSession = {
            ...session,
            expiresAt: newExpiry,
            extensionCount: extensionCount + 1,
            lastExtendedAt: now
        };
        
        await wallet._put('session', { id: 'current', ...updatedSession });
        
        console.log(` Session extended (${extensionCount + 1}/${SESSION_CONFIG.MAX_EXTENSIONS})`);
        
        const result = {
            success: true,
            expiresAt: newExpiry,
            extensionCount: extensionCount + 1,
            extensionsRemaining: SESSION_CONFIG.MAX_EXTENSIONS - extensionCount - 1
        };
        updateSessionCache({
            valid: true,
            expiresAt: newExpiry,
            timeRemaining: newExpiry - now,
            unlockedAt: session.unlockedAt,
            extensionCount: extensionCount + 1,
            canExtend: extensionCount + 1 < SESSION_CONFIG.MAX_EXTENSIONS,
            shouldPromptExtend: (newExpiry - now) < SESSION_CONFIG.EXTEND_THRESHOLD,
            walletExists: true
        });
        return result;
    } catch (e) {
        console.error('Session extend error:', e);
        return { success: false, reason: 'error', error: e.message };
    }
}

async function getCredentialsCached(filterType, requestingSite, showAll) {
    const key = `${filterType || 'all'}|${requestingSite || 'unknown'}|${showAll ? 'all' : 'site'}`;
    const cached = cache.credentials.get(key);
    if (cached && isFresh(cached.ts, CACHE_CONFIG.credentialsTtlMs)) {
        return cached.value;
    }
    if (cache.credentialsPromises.has(key)) {
        return await cache.credentialsPromises.get(key);
    }
    const promise = (async () => {
        let credentials = (await wallet.getCredentials(filterType)).map(normalizeCredentialRecord);
        const isLemmaRequesting = isLemmaInfrastructureSite(requestingSite);
        if (!isLemmaRequesting && !showAll) {
            credentials = credentials.filter(c => {
                const claims = c.claims || c.credentialSubject || {};
                const normalizedCredSite = getCredentialSiteBinding(claims);
                if (!normalizedCredSite) return false;
                return normalizedCredSite === requestingSite ||
                       requestingSite.endsWith('.' + normalizedCredSite) ||
                       normalizedCredSite.endsWith('.' + requestingSite);
            });
        }
        const value = { credentials, isLemmaRequesting };
        cache.credentials.set(key, { value, ts: Date.now() });
        return value;
    })().finally(() => {
        cache.credentialsPromises.delete(key);
    });
    cache.credentialsPromises.set(key, promise);
    return await promise;
}

// ============================================
// MESSAGE HANDLER - CROSS-SITE COMMUNICATION
// ============================================

window.addEventListener('message', async (event) => {
    const origin = event.origin;
    const startTime = performance.now();
    
    // Basic origin validation (client-side only, no server call)
    if (!isOriginAllowed(origin)) {
        console.warn(' Message from unauthorized origin:', origin);
        return;
    }
    
    const { type, payload, requestId } = event.data || {};
    
    if (!type) return;
    
    const requestingSite = getHostnameFromOrigin(origin);
    console.log(` Bridge received: ${type} from ${requestingSite}`);
    
    // Helper to send response back with timing info
    const respond = (data) => {
        const processingTime = performance.now() - startTime;
        event.source.postMessage({
            type: `${type}_response`,
            requestId,
            _processingTimeMs: processingTime.toFixed(2),
            _networkCalls: 0,  // Always 0 - local-first!
            ...data
        }, origin);
    };
    
    try {
        switch (type) {
            // ========================================
            // HEALTH & INIT (no session required)
            // ========================================
            
            case 'WALLET_PING':
                respond({ 
                    success: true, 
                    ready: !!wallet,
                    version: '2.0',
                    localFirst: true
                });
                break;
                
            case 'WALLET_INIT':
                const initResult = await initWallet();
                respond({ success: initResult });
                break;
                
            case 'WALLET_STATUS':
                if (!wallet) await initWallet();
                const info = await wallet.getWalletInfo();
                const sessionStatus = await checkSession();
                respond({
                    success: true,
                    isUnlocked: info.isUnlocked,
                    hasPasskey: info.hasPasskey,
                    hasWalletSecret: info.hasWalletSecret,
                    credentialCount: info.credentialCount || 0,
                    session: sessionStatus
                });
                break;
            
            // ========================================
            // SESSION MANAGEMENT (local-first)
            // ========================================
            
            case 'CHECK_SESSION':
                // Check session validity - can force server sync if requested
                // force: true bypasses cache and syncs with server (use after popup unlock)
                const forceRefresh = payload?.force === true;
                if (forceRefresh) {
                    console.log(' Force session refresh requested - syncing with server...');
                    // Clear cache and force server sync
                    cache.session = { value: null, ts: 0, promise: null };
                    lastServerSync = 0;
                }
                const session = await checkSession({ force: forceRefresh });
                respond({
                    success: true,
                    ...session,
                    refreshed: forceRefresh
                });
                break;
                
            case 'SET_LOCAL_SESSION':
                // Set session directly from SDK (bypasses cookie partitioning)
                // This is called after redirect unlock succeeds on third-party sites
                if (!wallet) await initWallet();

                const incomingSession = payload?.session;

                if (incomingSession && incomingSession.isUnlocked) {
                    console.log(' SET_LOCAL_SESSION: Receiving session from SDK');

                    // Store session in bridge's IndexedDB
                    const sessionToStore = {
                        id: 'current',
                        isUnlocked: true,
                        unlockedAt: incomingSession.unlockedAt || Date.now(),
                        expiresAt: incomingSession.expiresAt,
                        walletId: incomingSession.walletId,
                        source: 'sdk_sync'
                    };
                    await wallet._put('session', sessionToStore);

                    // IMPORTANT: Store wallet_id separately for global-session lookups
                    // This is critical for the global-session fallback when cookies are blocked
                    if (incomingSession.walletId) {
                        await wallet._put('passkey', { id: 'walletId', value: incomingSession.walletId });
                        console.log(' Wallet ID stored for global-session lookups');
                    }

                    // Clear session cache so next check uses fresh data
                    cache.session = { value: null, ts: 0, promise: null };

                    console.log(' Session synced from SDK - bridge now has valid session');
                    respond({ success: true, sessionSet: true });
                } else {
                    respond({ success: false, error: 'Invalid session data' });
                }
                break;
                
            case 'EXTEND_SESSION':
                // Extend session with tap-only auth
                const extendResult = await extendSession();
                respond(extendResult);
                break;

            case 'LOCK_SESSION':
                // Clear central session from lemma.id origin on behalf of a third-party tab.
                // This ensures lock/signoff propagates across all devices and sites.
                if (!wallet) await initWallet();
                try {
                    const requestedWalletId = payload?.walletId || payload?.wallet_id;
                    const localSession = await wallet._get('session', 'current');
                    const fallbackWalletId = localSession?.walletId || null;
                    const lockWalletId = requestedWalletId || fallbackWalletId;

                    const lockResp = await fetch('/api/wallet/clear-session', {
                        method: 'POST',
                        credentials: 'include',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(lockWalletId ? { wallet_id: lockWalletId } : {})
                    });

                    const lockData = await lockResp.json().catch(() => ({}));

                    // Clear bridge-local session cache/storage immediately.
                    try {
                        await wallet._delete('session', 'current');
                    } catch (e) {
                        console.warn('LOCK_SESSION: failed to clear local bridge session:', e.message);
                    }
                    cache.session = { value: null, ts: 0, promise: null };

                    // Same-device instant fan-out for other lemma.id tabs/bridges.
                    if (sessionChannel) {
                        sessionChannel.postMessage({
                            type: 'LOCK',
                            walletId: lockWalletId || null,
                            source: 'bridge'
                        });
                    }

                    // Notify parent immediately so host app can react without waiting.
                    if (window.parent !== window) {
                        window.parent.postMessage({
                            type: 'SESSION_INVALIDATED',
                            reason: 'lock',
                            walletId: lockWalletId || null,
                            timestamp: Date.now(),
                            instant: true
                        }, '*');
                    }

                    respond({
                        success: lockResp.ok,
                        walletId: lockWalletId || null,
                        serverStatus: lockResp.status,
                        ...lockData
                    });
                } catch (e) {
                    console.error('LOCK_SESSION error:', e.message);
                    respond({ success: false, error: e.message });
                }
                break;
                
            case 'WALLET_UNLOCK':
                // Full passkey unlock (biometric required)
                if (!wallet) await initWallet();
                try {
                    const unlockResult = await wallet.unlock();
                    const newSession = await checkSession({ force: true });
                    respond({ 
                        success: true,
                        ...unlockResult,
                        session: newSession
                    });
                } catch (e) {
                    respond({ success: false, error: e.message });
                }
                break;
                
            case 'ISSUE_LEMMA':
                // Issue a lemma for the requesting site WITHOUT exposing wallet_secret.
                // The bridge derives the PPID internally (first-party origin has the secret)
                // and calls lemma.id's issuance API. Only the signed lemma crosses origins.
                console.log('ISSUE_LEMMA request from', requestingSite);
                if (!wallet) await initWallet();
                
                const issueSiteId = payload?.siteId || requestingSite;
                const issueSession = await checkSession();
                
                if (!issueSession.valid) {
                    respond({ success: false, error: 'session_invalid' });
                    return;
                }
                
                try {
                    // Derive PPID internally (wallet_secret stays on lemma.id origin)
                    const ppid = await wallet.derivePPID(issueSiteId);
                    
                    // Call issuance API (first-party request, includes cookies)
                    const issueResp = await fetch('/api/wallet-auth/issue', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify({ site_id: issueSiteId, ppid: ppid })
                    });
                    
                    if (!issueResp.ok) {
                        const errData = await issueResp.json().catch(() => ({}));
                        console.warn('ISSUE_LEMMA failed:', issueResp.status, errData);
                        respond({ success: false, error: errData.error || 'issuance_failed' });
                        return;
                    }
                    
                    const issueData = await issueResp.json();
                    
                    if (issueData.success && issueData.permission_lemma) {
                        // Store the lemma in the bridge's IndexedDB
                        await wallet.storeCredential(issueData.permission_lemma);
                        
                        console.log('ISSUE_LEMMA: issued and stored for', issueSiteId);
                        respond({
                            success: true,
                            ppid: issueData.ppid,
                            lemma: issueData.permission_lemma,
                            site_id: issueSiteId
                        });
                    } else {
                        respond({ success: false, error: issueData.error || 'no_lemma_returned' });
                    }
                } catch (e) {
                    console.error('ISSUE_LEMMA error:', e.message);
                    respond({ success: false, error: e.message });
                }
                break;

            case 'GET_WALLET_SECRET':
                // DEPRECATED: Use ISSUE_LEMMA instead. Wallet secret should not cross origins.
                // Kept for backwards compatibility during migration.
                console.warn('GET_WALLET_SECRET blocked; use ISSUE_LEMMA');
                respond({
                    success: false,
                    error: 'wallet_secret_export_disabled',
                    message: 'Use ISSUE_LEMMA flow instead of raw secret export.'
                });
                break;
                
            // ========================================
            // CREDENTIAL STORAGE (session required for writes)
            // ========================================
            
            case 'STORE_CREDENTIAL':
                // Store a credential in the wallet
                // SECURITY: Requires valid session for write operations
                if (!wallet) await initWallet();
                
                // Check session for write operations
                const storeSession = await checkSession();
                if (!storeSession.valid) {
                    console.warn(` Blocked store: No valid session from ${requestingSite}`);
                    respond({ 
                        success: false, 
                        error: 'Session required to store credentials',
                        sessionStatus: storeSession
                    });
                    return;
                }
                
                const credential = payload?.credential;
                if (!credential) {
                    respond({ success: false, error: 'No credential provided' });
                    return;
                }
                
                // Validate credential has required fields
                if (!credential.id || !credential.issuer) {
                    respond({ success: false, error: 'Invalid credential format' });
                    return;
                }
                
                // SECURITY: Validate credential's siteId matches the requesting origin
                // EXCEPTIONS:
                // - lemma.id can store credentials for ANY site (unified wallet)
                // - Internal site IDs (site_xxx format) are only allowed FROM lemma.id origin
                // SECURITY: The hex regex was removed - it allowed any site to fake internal IDs
                const credClaims = credential.claims || credential.credentialSubject || {};
                const credSiteId = getCredentialSiteBinding(credClaims);
                const isLemmaOrigin = isLemmaInfrastructureSite(requestingSite);

                // SECURITY: Internal siteIds can ONLY come from lemma.id, not arbitrary sites
                const isInternalSiteId = isLemmaOrigin && (
                    credSiteId.startsWith('site_') || credSiteId.match(/^[a-f0-9-]{20,}$/)
                );

                if (!isLemmaOrigin && !isInternalSiteId && credSiteId && credSiteId !== requestingSite &&
                    !requestingSite.endsWith('.' + credSiteId) &&
                    !credSiteId.endsWith('.' + requestingSite)) {
                    console.warn(` Blocked: ${requestingSite} tried to store credential for ${credSiteId}`);
                    respond({ success: false, error: 'Cannot store credentials for other sites' });
                    return;
                }
                
                // Store the requesting site's domain for future filtering
                credential.storedFromDomain = requestingSite;
                
                // Ensure packageType is set for proper filtering
                credential.packageType = credential.packageType || 'permission';

                // Store the credential locally (no server sync - privacy preserved)
                const storeResult = await wallet.storeCredential(credential);
                clearCredentialsCache();
                console.log(` Credential stored locally via bridge for ${requestingSite} (siteId: ${credSiteId}):`, credential.id);

                respond({
                    success: true,
                    credentialId: credential.id,
                    stored: true,
                    sessionRemaining: storeSession.timeRemaining
                });
                break;

            case 'GET_CREDENTIAL': {
                // isHuman Network: return a single credential for the requesting site.
                // If no per-site isHuman credential exists yet, derive one from the
                // master proof via the server and cache it locally.
                if (!wallet) await initWallet();

                const ihSite = payload?.siteId || requestingSite;
                const ihType = payload?.credentialType;  // e.g. 'isHuman'

                // 1. Check for an existing per-site credential
                let allCreds = (await wallet.getCredentials()).map(normalizeCredentialRecord);
                let match = allCreds.find(c => {
                    const cl = c.claims || c.credentialSubject || {};
                    const boundSite = getCredentialSiteBinding(cl);
                    if (ihType === 'isHuman' && !cl.isHuman) return false;
                    return boundSite === ihSite;
                });

                if (match) {
                    respond({ success: true, credential: match });
                    break;
                }

                // 2. No per-site credential — look for the master isHuman proof
                const master = allCreds.find(c => {
                    const cl = c.claims || c.credentialSubject || {};
                    const boundSite = getCredentialSiteBinding(cl);
                    return cl.isHuman && (boundSite === 'lemma.id' || !boundSite);
                });

                if (!master) {
                    respond({ success: false, error: 'no_ishuman_credential' });
                    break;
                }

                // 3. Derive a per-site credential from the master via the server
                try {
                    const walletId = wallet.walletId || (await wallet.getWalletInfo?.())?.walletId || '';
                    const deriveRes = await fetch('/api/ishuman/derive-site-proof', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            master_credential_id: master.id,
                            wallet_id: walletId,
                            target_site: ihSite,
                        }),
                    });
                    const deriveData = await deriveRes.json();

                    if (deriveData.success && deriveData.credential) {
                        const derived = deriveData.credential;
                        derived.packageType = derived.packageType || 'identity';
                        await wallet.storeCredential(derived);
                        clearCredentialsCache();
                        console.log(` isHuman: derived site proof for ${ihSite}:`, derived.id);
                        respond({ success: true, credential: derived });
                    } else {
                        console.warn(' isHuman: derivation failed:', deriveData.error);
                        respond({ success: false, error: deriveData.error || 'derivation_failed' });
                    }
                } catch (deriveErr) {
                    console.error(' isHuman: derivation request failed:', deriveErr);
                    respond({ success: false, error: 'derivation_network_error' });
                }
                break;
            }

            case 'GET_CREDENTIALS':
                // Get credentials - SECURITY: Only return credentials for the requesting origin
                // NOTE: Read operations allowed without active session (credentials are signed)
                if (!wallet) await initWallet();
                
                const filterType = payload?.type || null;
                const showAll = payload?.showAll || false;  // Flag to show all credentials
                
                const cached = await getCredentialsCached(filterType, requestingSite, showAll);
                const credentials = cached.credentials;
                const isLemmaRequesting = cached.isLemmaRequesting;
                
                // Get session status for client convenience
                const getCredsSession = await checkSession();
                
                console.log(` Returning ${credentials.length} credentials for ${requestingSite}${isLemmaRequesting ? ' (unified wallet)' : ''}`);
                
                respond({
                    success: true,
                    credentials: credentials,
                    count: credentials.length,
                    filteredFor: isLemmaRequesting ? 'all' : requestingSite,
                    unifiedWallet: isLemmaRequesting,
                    session: getCredsSession,
                    // Help client know if they need to prompt unlock
                    needsUnlock: !getCredsSession.valid && credentials.length === 0
                });
                break;
                
            case 'VERIFY_CREDENTIAL':
                // Verify a credential locally using Ed25519 - NO SERVER CALLS
                // This is Lemma's core edge: local cryptographic verification
                // SECURITY: Also validates credential is for requesting site (device binding)
                if (!wallet) await initWallet();
                
                const credToVerify = payload?.credential;
                if (!credToVerify) {
                    respond({ success: false, error: 'No credential provided' });
                    return;
                }
                
                // SECURITY: Validate credential's siteId matches requesting site
                // This enforces site-specific credential isolation
                const verifyClaims = credToVerify.claims || credToVerify.credentialSubject || {};
                const verifySiteId = getCredentialSiteBinding(verifyClaims);
                const isLemmaVerifying = isLemmaInfrastructureSite(requestingSite);

                // SECURITY: Internal siteIds only trusted from lemma.id origin
                const isInternalVerifySiteId = isLemmaVerifying && (
                    verifySiteId.startsWith('site_') || verifySiteId.match(/^[a-f0-9-]{20,}$/)
                );

                // Allow verification if:
                // 1. lemma.id is verifying (unified wallet)
                // 2. siteId is internal/opaque (only from lemma.id)
                // 3. siteId matches requesting site (or subdomain)
                // 4. No siteId (cross-site credential)
                const siteIdMatches = !verifySiteId || isLemmaVerifying || isInternalVerifySiteId ||
                    verifySiteId === requestingSite ||
                    requestingSite.endsWith('.' + verifySiteId) ||
                    verifySiteId.endsWith('.' + requestingSite);
                
                if (!siteIdMatches) {
                    console.warn(` Blocked verify: ${requestingSite} tried to verify credential for ${verifySiteId}`);
                    respond({ 
                        success: false, 
                        valid: false,
                        error: 'Cannot verify credentials for other sites',
                        reason: 'Site mismatch'
                    });
                    return;
                }
                
                const verifyStart = performance.now();
                const verification = await wallet.verifyLemma(credToVerify);
                const verifyTime = performance.now() - verifyStart;
                
                respond({
                    success: true,
                    valid: verification.valid,
                    reason: verification.reason,
                    issuer: verification.issuer,
                    claims: verification.claims,
                    verificationTimeMs: verifyTime.toFixed(2),
                    verificationTimeUs: verification.verifyTimeUs,
                    // Security metadata
                    verifiedLocally: true,
                    networkCalls: 0,
                    siteIsolation: verifySiteId ? 'site_specific' : 'cross_site',
                    deviceBound: true  // Credential access requires passkey (device-bound)
                });
                break;
            
            case 'QUICK_VERIFY':
                // Quick verify - skips signature if already verified (cached)
                // ~50μs vs ~1000μs for full verification
                // SECURITY: Also validates credential is for requesting site
                if (!wallet) await initWallet();
                
                const quickCredential = payload?.credential;
                if (!quickCredential) {
                    respond({ success: false, error: 'No credential provided' });
                    return;
                }
                
                // SECURITY: Same siteId validation as full verify
                const quickClaims = quickCredential.claims || quickCredential.credentialSubject || {};
                const quickSiteId = getCredentialSiteBinding(quickClaims);
                const isLemmaQuickVerify = isLemmaInfrastructureSite(requestingSite);

                // SECURITY: Internal siteIds only trusted from lemma.id origin
                const isInternalQuickSiteId = isLemmaQuickVerify && (
                    quickSiteId.startsWith('site_') || quickSiteId.match(/^[a-f0-9-]{20,}$/)
                );

                const quickSiteMatches = !quickSiteId || isLemmaQuickVerify || isInternalQuickSiteId ||
                    quickSiteId === requestingSite ||
                    requestingSite.endsWith('.' + quickSiteId) ||
                    quickSiteId.endsWith('.' + requestingSite);
                
                if (!quickSiteMatches) {
                    console.warn(` Blocked quick verify: ${requestingSite} tried to verify credential for ${quickSiteId}`);
                    respond({ 
                        success: false, 
                        valid: false,
                        error: 'Cannot verify credentials for other sites',
                        reason: 'Site mismatch'
                    });
                    return;
                }
                
                const quickResult = await wallet.quickVerify(quickCredential);
                respond({
                    success: true,
                    ...quickResult,
                    verifiedLocally: true,
                    networkCalls: 0,
                    siteIsolation: quickSiteId ? 'site_specific' : 'cross_site',
                    deviceBound: true
                });
                break;
                
            case 'REMOVE_CREDENTIAL':
                // Remove a credential - SECURITY: Requires session + site ownership
                if (!wallet) await initWallet();
                
                // Check session for write operations
                const removeSession = await checkSession();
                if (!removeSession.valid) {
                    console.warn(` Blocked remove: No valid session from ${requestingSite}`);
                    respond({ 
                        success: false, 
                        error: 'Session required to remove credentials',
                        sessionStatus: removeSession
                    });
                    return;
                }
                
                const credId = payload?.credentialId;
                if (!credId) {
                    respond({ success: false, error: 'No credentialId provided' });
                    return;
                }
                
                // SECURITY: Verify credential belongs to requesting site
                const allCreds = await wallet.getCredentials();
                const credToRemove = allCreds.find(c => c.id === credId);
                
                if (credToRemove) {
                    const removeClaims = credToRemove.claims || credToRemove.credentialSubject || {};
                    const removeSiteId = getCredentialSiteBinding(removeClaims);
                    
                    if (removeSiteId && removeSiteId !== requestingSite &&
                        !requestingSite.endsWith('.' + removeSiteId) &&
                        !removeSiteId.endsWith('.' + requestingSite)) {
                        console.warn(` Blocked: ${requestingSite} tried to remove credential for ${removeSiteId}`);
                        respond({ success: false, error: 'Cannot remove credentials for other sites' });
                        return;
                    }
                }
                
                await wallet.removeCredential(credId);
                clearCredentialsCache();
                console.log(` Credential removed via bridge for ${requestingSite}:`, credId);
                respond({ success: true, removed: true });
                break;
            
            // ========================================
            // REVOCATION (background sync, non-blocking)
            // ========================================
            
            case 'SYNC_REVOCATIONS':
                // Sync revocation list - this IS a network call, but background/optional
                if (!wallet) await initWallet();
                const syncResult = await wallet.syncRevocations();
                respond({
                    success: syncResult.success,
                    count: syncResult.count,
                    offline: syncResult.offline,
                    cached: syncResult.cached,
                    // Note: This is the ONE network call in the system
                    networkCalls: syncResult.success ? 1 : 0
                });
                break;
            
            case 'REVOKE_CREDENTIAL':
                // REVOKE a credential - adds to bloom filter AND deletes locally
                // SECURITY: Requires session + site ownership
                if (!wallet) await initWallet();
                
                // Check session for write operations
                const revokeSession = await checkSession();
                if (!revokeSession.valid) {
                    console.warn(` Blocked revoke: No valid session from ${requestingSite}`);
                    respond({ 
                        success: false, 
                        error: 'Session required to revoke credentials',
                        sessionStatus: revokeSession
                    });
                    return;
                }
                
                const revokeCredId = payload?.credentialId;
                const revokeReason = payload?.reason || 'user_requested';
                if (!revokeCredId) {
                    respond({ success: false, error: 'No credentialId provided' });
                    return;
                }
                
                // SECURITY: Verify credential belongs to requesting site
                const allCredsForRevoke = await wallet.getCredentials();
                const credToRevoke = allCredsForRevoke.find(c => c.id === revokeCredId);
                
                let revokeSiteId = requestingSite;
                let credType = 'permission';
                
                if (credToRevoke) {
                    const revokeClaims = credToRevoke.claims || credToRevoke.credentialSubject || {};
                    revokeSiteId = (revokeClaims.siteId || revokeClaims.site_id || requestingSite).toLowerCase().replace(/^www\./, '');
                    credType = credToRevoke.packageType || 'permission';
                    
                    // Check site ownership (lemma.id can revoke any)
                    const isLemmaRevoking = isLemmaInfrastructureSite(requestingSite);
                    if (!isLemmaRevoking && revokeSiteId !== requestingSite &&
                        !requestingSite.endsWith('.' + revokeSiteId) &&
                        !revokeSiteId.endsWith('.' + requestingSite)) {
                        console.warn(` Blocked: ${requestingSite} tried to revoke credential for ${revokeSiteId}`);
                        respond({ success: false, error: 'Cannot revoke credentials for other sites' });
                        return;
                    }
                }
                
                // 1. Add to server revocation list (bloom filter)
                let serverRevoked = false;
                try {
                    const revokeResponse = await fetch('https://lemma.id/api/wallet/revoke', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify({
                            credential_id: revokeCredId,
                            credential_type: credType,
                            site_domain: revokeSiteId,
                            reason: revokeReason
                        })
                    });
                    
                    if (revokeResponse.ok) {
                        const revokeData = await revokeResponse.json();
                        serverRevoked = revokeData.success;
                        console.log(` Credential revoked on server: ${revokeCredId}`, revokeData);
                    } else {
                        console.warn(` Server revocation failed: ${revokeResponse.status}`);
                    }
                } catch (e) {
                    console.warn(` Server revocation error: ${e.message}`);
                }
                
                // 2. Delete from local IndexedDB
                await wallet.removeCredential(revokeCredId);
                clearCredentialsCache();
                
                // 3. Force sync revocation list locally
                await wallet.syncRevocations();
                
                console.log(` Credential revoked via bridge for ${requestingSite}:`, revokeCredId);
                respond({ 
                    success: true, 
                    revoked: true,
                    serverRevoked: serverRevoked,
                    credentialId: revokeCredId,
                    addedToBloomFilter: serverRevoked,
                    locallyDeleted: true,
                    sitesShouldSync: true  // Signal that other sites should sync revocation list
                });
                break;
                
            case 'GET_ALL_CREDENTIALS':
                // Get ALL credentials from unified wallet (for lemma.id wallet UI)
                // SECURITY: Only allowed from lemma.id origin
                if (!wallet) await initWallet();
                
                const isWalletOrigin = isLemmaInfrastructureSite(requestingSite);
                if (!isWalletOrigin) {
                    respond({ 
                        success: false, 
                        error: 'GET_ALL_CREDENTIALS only allowed from lemma.id',
                        hint: 'Use GET_CREDENTIALS for per-site filtered access'
                    });
                    return;
                }
                
                const allCredentials = await wallet.getCredentials();
                const allSession = await checkSession();
                
                console.log(` Returning ALL ${allCredentials.length} credentials for unified wallet`);
                
                respond({
                    success: true,
                    credentials: allCredentials,
                    count: allCredentials.length,
                    unifiedWallet: true,
                    session: allSession
                });
                break;
                
            case 'GET_REVOCATION_INFO':
                // Get revocation cache info - NO network call
                if (!wallet) await initWallet();
                const revInfo = await wallet.getRevocationInfo();
                respond({
                    success: true,
                    ...revInfo,
                    networkCalls: 0
                });
                break;
            
            // ========================================
            // HIGH-SECURITY: FRESH AUTHENTICATION
            // For banks, financial apps that need proof of recent auth
            // ========================================
            
            case 'REQUIRE_FRESH_AUTH':
                // Force fresh passkey authentication (full biometric, not tap-only)
                // Returns timestamp of authentication for high-security verification
                if (!wallet) await initWallet();
                
                const maxAgeMs = payload?.maxAgeMs || 30000;  // Default 30 seconds
                const currentSession = await checkSession();
                
                // Check if current auth is fresh enough
                if (currentSession.valid && currentSession.unlockedAt) {
                    const authAge = Date.now() - currentSession.unlockedAt;
                    if (authAge < maxAgeMs) {
                        // Auth is fresh enough, return attestation
                        respond({
                            success: true,
                            fresh: true,
                            authTimestamp: currentSession.unlockedAt,
                            authAgeMs: authAge,
                            maxAgeMs: maxAgeMs,
                            walletId: await wallet._get('passkey', 'walletId')?.value,
                            // Sites can verify this timestamp with Lemma server if needed
                            verificationEndpoint: 'https://lemma.id/api/verify-session-freshness'
                        });
                        return;
                    }
                }
                
                // Need fresh authentication
                const passkey = await wallet._get('passkey', 'primary');
                if (!passkey) {
                    respond({ success: false, error: 'No passkey registered' });
                    return;
                }
                
                try {
                    // Full biometric verification (not tap-only)
                    const freshAuthCredential = await navigator.credentials.get({
                        publicKey: {
                            challenge: crypto.getRandomValues(new Uint8Array(32)),
                            rpId: window.location.hostname,
                            allowCredentials: [{
                                id: wallet._base64urlToBuffer(passkey.credentialId),
                                type: 'public-key'
                            }],
                            userVerification: 'required',  // FULL biometric required
                            timeout: 60000
                        }
                    });
                    
                    if (!freshAuthCredential) {
                        respond({ success: false, error: 'Authentication cancelled' });
                        return;
                    }
                    
                    // Update session with fresh unlock time
                    const freshAuthTime = Date.now();
                    const updatedSession = {
                        id: 'current',
                        unlockedAt: freshAuthTime,
                        expiresAt: freshAuthTime + SESSION_CONFIG.DEFAULT_DURATION,
                        extensionCount: 0,  // Reset extensions on fresh auth
                        freshAuthAt: freshAuthTime  // Track fresh auth specifically
                    };
                    await wallet._put('session', updatedSession);
                    
                    const walletIdRecord = await wallet._get('passkey', 'walletId');
                    
                    respond({
                        success: true,
                        fresh: true,
                        authTimestamp: freshAuthTime,
                        authAgeMs: 0,
                        maxAgeMs: maxAgeMs,
                        walletId: walletIdRecord?.value,
                        // High-security sites can call this endpoint to verify
                        verificationEndpoint: 'https://lemma.id/api/verify-session-freshness'
                    });
                    
                } catch (e) {
                    respond({ success: false, error: 'Authentication failed: ' + e.message });
                }
                break;
            
            case 'GET_AUTH_FRESHNESS':
                // Check how fresh the current auth is (without requiring new auth)
                if (!wallet) await initWallet();
                
                const freshnessSession = await checkSession();
                if (!freshnessSession.valid || !freshnessSession.unlockedAt) {
                    respond({
                        success: true,
                        authenticated: false,
                        fresh: false,
                        reason: 'no_session'
                    });
                    return;
                }
                
                const authAgeMs = Date.now() - freshnessSession.unlockedAt;
                const freshAuthAt = freshnessSession.freshAuthAt || freshnessSession.unlockedAt;
                const freshAuthAgeMs = Date.now() - freshAuthAt;
                
                respond({
                    success: true,
                    authenticated: true,
                    authTimestamp: freshnessSession.unlockedAt,
                    authAgeMs: authAgeMs,
                    freshAuthTimestamp: freshAuthAt,
                    freshAuthAgeMs: freshAuthAgeMs,
                    // Convenience flags for different security levels
                    freshUnder30s: freshAuthAgeMs < 30000,
                    freshUnder5min: freshAuthAgeMs < 300000,
                    freshUnder1hr: freshAuthAgeMs < 3600000
                });
                break;
                
            case 'REQUEST_STORAGE_ACCESS':
                // Request storage access with user gesture context
                // Parent should call this after user interaction (click)
                const storageResult = await requestStorageAccessWithGesture();
                respond(storageResult);
                break;
                
            case 'DEBUG_DB':
                // Debug: dump database info
                if (!wallet) await initWallet();
                
                try {
                    const sessionData = await wallet._get('session', 'current');
                    const passkeyData = await wallet._get('passkey', 'primary');
                    const walletIdData = await wallet._get('passkey', 'walletId');
                    
                    respond({
                        success: true,
                        debug: {
                            origin: window.location.origin,
                            hostname: window.location.hostname,
                            dbName: wallet.db?.name,
                            dbVersion: wallet.db?.version,
                            session: sessionData ? {
                                exists: true,
                                isUnlocked: sessionData.isUnlocked,
                                unlockedAt: sessionData.unlockedAt,
                                expiresAt: sessionData.expiresAt,
                                isExpired: sessionData.expiresAt < Date.now(),
                                timeRemaining: sessionData.expiresAt - Date.now()
                            } : { exists: false },
                            passkey: passkeyData ? { exists: true } : { exists: false },
                            walletId: walletIdData?.value || null
                        }
                    });
                } catch (e) {
                    respond({ success: false, error: e.message, stack: e.stack });
                }
                break;
                
            default:
                respond({ success: false, error: `Unknown message type: ${type}` });
        }
        
    } catch (error) {
        console.error(` Bridge error handling ${type}:`, error);
        respond({ success: false, error: error.message });
    }
});

// ============================================
// SESSION SYNC (for partitioned storage)
// ============================================

/**
 * Sync session from lemma.id server when local storage is empty.
 * This enables "One Passkey Per Day" by using httpOnly cookies.
 * 
 * @returns {Object} Sync result with session data
 */
// Get CSRF token from cookie for double-submit protection
function getCsrfToken() {
    const match = document.cookie.match(/lemma_wallet_csrf=([^;]+)/);
    return match ? match[1] : null;
}

// Get headers with CSRF token
function getSecureHeaders() {
    const headers = { 'Content-Type': 'application/json' };
    const csrf = getCsrfToken();
    if (csrf) {
        headers['X-Lemma-CSRF'] = csrf;
    }
    return headers;
}

async function syncSessionFromServer() {
    try {
        console.log(' Attempting session sync from server...');

        // First try cookie-based session-sync
        const response = await fetch('https://lemma.id/api/wallet/session-sync', {
            method: 'POST',
            credentials: 'include',  // Include cookies
            headers: getSecureHeaders()
        });

        if (response.ok) {
            const data = await response.json();
            if (data.success && data.session) {
                console.log(' Session synced from server (via cookie)!');
                return await storeSessionFromServer(data.session, data.credentials);
            }
        }

        // Cookie-based sync failed - try global-session fallback
        // This works even when third-party cookies are blocked
        console.log(' Cookie sync failed, trying global-session fallback...');

        // Get wallet_id from local IndexedDB
        let walletId = null;
        if (wallet) {
            const walletIdRecord = await wallet._get('passkey', 'walletId');
            walletId = walletIdRecord?.value;
        }

        if (!walletId) {
            console.log(' No wallet_id in local storage - cannot check global session');
            return { success: false, error: 'no_wallet_id' };
        }

        // Try global-session endpoint (doesn't rely on cookies)
        const globalResponse = await fetch('https://lemma.id/api/wallet/global-session', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ wallet_id: walletId })
        });

        if (globalResponse.ok) {
            const globalData = await globalResponse.json();
            if (globalData.success && globalData.valid && globalData.session) {
                console.log(' Session synced from global-session (bypassed cookie blocking)!');
                return await storeSessionFromServer(globalData.session, []);
            }
        }

        console.log(' Session sync: No valid session on server');
        return { success: false, error: 'no_session' };

    } catch (e) {
        console.warn(' Session sync error:', e.message);
        return { success: false, error: e.message };
    }
}

// Helper to store session data from server response
async function storeSessionFromServer(session, credentials = []) {
    if (!wallet) {
        return { success: false, error: 'wallet_not_initialized' };
    }

    await wallet._put('session', {
        id: 'current',
        isUnlocked: true,
        unlockedAt: session.unlocked_at,
        expiresAt: session.expires_at * 1000, // Convert to ms
        walletId: session.wallet_id,
        syncedFromServer: true,
        syncedAt: Date.now()
    });

    updateSessionCache({
        valid: true,
        expiresAt: session.expires_at * 1000,
        timeRemaining: (session.expires_at * 1000) - Date.now(),
        unlockedAt: session.unlocked_at,
        extensionCount: 0,
        canExtend: true,
        shouldPromptExtend: false,
        walletExists: true
    });

    // Store any synced credentials
    if (credentials && credentials.length > 0) {
        for (const cred of credentials) {
            await wallet._put('lemmas', cred);
        }
        clearCredentialsCache();
        console.log(`   └─ Synced ${credentials.length} credentials`);
    }

    return {
        success: true,
        session: session,
        credentials: credentials || []
    };
}

// ============================================
// BROADCASTCHANNEL - INSTANT SAME-DEVICE SYNC
// ============================================

/**
 * BroadcastChannel enables instant session sync across tabs/windows
 * on the SAME DEVICE (same-origin: lemma.id).
 *
 * When wallet_simple.html locks/unlocks, it broadcasts to this channel.
 * The bridge receives it and forwards to the parent site via postMessage.
 * This enables instant lock detection without polling (300ms vs 2-5s).
 */
let sessionChannel = null;
try {
    sessionChannel = new BroadcastChannel('lemma-session');
    console.log(' BroadcastChannel initialized for instant same-device sync');

    sessionChannel.onmessage = async (event) => {
        const { type, walletId, source } = event.data || {};

        // Ignore messages from the bridge itself
        if (source === 'bridge') return;

        console.log(` Bridge received ${type} via BroadcastChannel from ${source}`);

        if (type === 'LOCK') {
            // Wallet was locked in another tab - notify parent immediately
            // This is the key optimization: instant notification, no polling
            if (window.parent !== window) {
                console.log(' Forwarding LOCK to parent via postMessage');
                window.parent.postMessage({
                    type: 'SESSION_INVALIDATED',
                    reason: 'lock',
                    walletId: walletId,
                    timestamp: Date.now(),
                    instant: true  // Flag that this came via BroadcastChannel
                }, '*');
            }

            // Also invalidate local session cache
            cache.session = { value: null, ts: 0, promise: null };
        } else if (type === 'UNLOCK') {
            // Wallet was unlocked in another tab - notify parent to refresh
            if (window.parent !== window) {
                console.log(' Forwarding UNLOCK to parent via postMessage');
                window.parent.postMessage({
                    type: 'SESSION_RESTORED',
                    walletId: walletId,
                    timestamp: Date.now(),
                    instant: true
                }, '*');
            }

            // Clear session cache to force fresh check
            cache.session = { value: null, ts: 0, promise: null };
        }
    };
} catch (e) {
    console.warn(' BroadcastChannel not supported:', e.message);
}

// ============================================
// INITIALIZATION (v2.4 - instant sync)
// ============================================

(async function() {
    const initStart = performance.now();
    let networkCalls = 0;
    
    // Initialize wallet (opens IndexedDB - no server call)
    const ready = await initWallet();
    
    // Check local session first (fast path - no network)
    let session = ready ? await checkSession() : { valid: false };
    
    // OPTIMIZATION: Only sync from server if local session is invalid
    // AND we haven't synced recently (avoid redundant 401s)
    const lastSyncAttempt = parseInt(sessionStorage.getItem('lemma_last_sync') || '0');
    const syncCooldownMs = 10000; // 10 second cooldown between sync attempts
    const shouldTrySync = !session.valid && 
                          window.parent !== window && 
                          (Date.now() - lastSyncAttempt) > syncCooldownMs;
    
    if (shouldTrySync) {
        sessionStorage.setItem('lemma_last_sync', Date.now().toString());
        const syncResult = await syncSessionFromServer();
        networkCalls = 1;
        
        if (syncResult.success) {
            session = await checkSession({ force: true });
            session.syncedFromServer = true;
        } else {
            session.needsUnlock = true;
            session.unlockUrl = 'https://lemma.id/wallet/unlock';
        }
    } else if (!session.valid && window.parent !== window) {
        // No sync attempted (cooldown) - just mark as needing unlock
        session.needsUnlock = true;
        session.unlockUrl = 'https://lemma.id/wallet/unlock';
    }
    
    const initTime = performance.now() - initStart;
    
    console.log(' Wallet bridge ready (v2.4 instant sync)');
    console.log(`   ├─ Initialized in ${initTime.toFixed(0)}ms`);
    console.log(`   ├─ Storage: ${storageAccessGranted ? 'unpartitioned' : 'partitioned'}`);
    console.log(`   ├─ Session: ${session.valid ? 'active ' : 'none/expired'}`);
    console.log(`   ├─ Synced from server: ${session.syncedFromServer ? 'yes' : 'no'}`);
    console.log(`   ├─ Instant sync: ${sessionChannel ? 'enabled ' : 'disabled'}`);
    console.log(`   └─ Network calls: ${networkCalls}`);

    // Notify parent that bridge is ready with session info
    if (window.parent !== window) {
        window.parent.postMessage({
            type: 'WALLET_BRIDGE_READY',
            ready: ready,
            version: '2.4',
            session: session,
            storageAccess: storageAccessGranted ? 'unpartitioned' : 'partitioned',
            initTimeMs: initTime.toFixed(2),
            networkCalls: networkCalls,
            // Include capabilities for SDK feature detection
            capabilities: {
                checkSession: true,
                extendSession: true,
                issueLemma: true,   // Bridge-side PPID derivation + issuance (wallet_secret stays on lemma.id)
                quickVerify: true,
                localVerification: true,
                revocationCache: true,
                freshAuth: true,
                authFreshnessCheck: true,
                storageAccessAPI: !!document.hasStorageAccess,
                sessionSync: true,
                instantSync: !!sessionChannel
            },
            // If no session, include unlock URL for SDK to redirect
            unlockUrl: session.needsUnlock ? 'https://lemma.id/wallet/unlock' : null
        }, '*');
    }
})();
