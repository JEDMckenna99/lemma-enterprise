<script nonce="{{ csp_nonce }}">
    // Wallet auto-init: only included on routes that need globalLemmaWallet at page load.
    if (typeof window.setNavLogoUnlocked !== 'function') {
        window.setNavLogoUnlocked = function setNavLogoUnlocked(unlocked) {
            const logo = document.getElementById('nav-logo') || document.querySelector('.nav-logo');
            if (!logo) return;
            const on = !!unlocked;
            logo.classList.toggle('is-unlocked', on);
            logo.setAttribute('data-unlocked', on ? 'true' : 'false');
            logo.title = on ? 'lemma.id unlocked' : 'lemma.id';
        };
    }

    async function initSessionFreeNav() {
        if (typeof LemmaWallet === 'undefined') {
            setTimeout(initSessionFreeNav, 50);
            return;
        }

        try {
            if (!window.globalLemmaWallet) {
                window.globalLemmaWallet = new LemmaWallet({
                    debug: false,
                    enableDeviceSync: true,
                    enableAdvancedFeatures: true
                });
                await window.globalLemmaWallet.init();
            }
            const wallet = window.globalLemmaWallet;
            wallet._autoStartHeartbeat?.();

            if (window.location.pathname === '/') {
                const skipManagerRedirect = new URLSearchParams(window.location.search).has('removed');
                if (!skipManagerRedirect) {
                    try {
                        const walletInfo = await wallet.getWalletInfo({ lite: true });
                        if (walletInfo.hasWallet) {
                            window.location.replace('/app');
                            return;
                        }
                    } catch (redirectError) {
                        console.warn('Root wallet redirect check failed:', redirectError.message);
                    }
                }
            }

            const isPublicPage = document.body.dataset.publicPage === 'true';

            function setLoggedOutUI() {
                const userDropdown = document.getElementById('user-dropdown');
                const authButtons = document.getElementById('auth-buttons');
                const publicDashboard = document.getElementById('public-dashboard-link');
                if (userDropdown) userDropdown.style.display = 'none';
                if (authButtons) authButtons.style.display = 'flex';
                if (publicDashboard) publicDashboard.style.display = 'none';

                const navAdmin = document.getElementById('nav-admin');
                const adminDropdown = document.getElementById('admin-dropdown-link');
                if (navAdmin) navAdmin.style.display = 'none';
                if (adminDropdown) adminDropdown.style.display = 'none';

                const devDashboardLink = document.getElementById('dev-dashboard-link');
                const apiKeysLink = document.getElementById('api-keys-link');
                if (devDashboardLink) devDashboardLink.style.display = 'none';
                if (apiKeysLink) apiKeysLink.style.display = 'none';

                const pricingLink = document.getElementById('nav-pricing');
                if (pricingLink) pricingLink.style.display = 'block';

                if (typeof window.setNavLogoUnlocked === 'function') {
                    window.setNavLogoUnlocked(false);
                }

                delete window.lemmaCredential;
                delete window.lemmaAuth;
            }

            function isDeveloperAccount(normalized, claims) {
                const accountType = (normalized?.accountType || claims.accountType || '').toLowerCase();
                const permissionId = (normalized?.permissionId || claims.permissionId || '').toLowerCase();
                if (['customer', 'developer', 'admin'].includes(accountType)) return true;
                if (['admin_access', 'super_admin', 'admin', 'superadmin', 'site_admin'].includes(permissionId)) return true;
                return normalized?.isAdmin === true;
            }

            function handleLockedState() {
                setLoggedOutUI();
                const protectedPath = /^\/(developer|admin|wallet)(\/|$)/.test(window.location.pathname);
                if (protectedPath) {
                    window.location.href = '/login?reason=wallet_locked';
                }
            }

            if (!window.__lemmaLockHandlersBound) {
                window.addEventListener('lemma:session-expired', handleLockedState);
                window.addEventListener('lemma-wallet-locked', handleLockedState);
                window.__lemmaLockHandlersBound = true;
            }

            const allCredentials = await wallet.getCredentials();
            const utils = window.LemmaCredentialUtils;

            const lemmaPermissions = utils && typeof utils.selectPlatformCredentials === 'function'
                ? utils.selectPlatformCredentials(allCredentials)
                : allCredentials.filter((p) => {
                    const claims = p.claims || p.credentialSubject || {};
                    const siteId = (claims.siteId || claims.site || claims.site_id || claims.siteDomain || '').toLowerCase();
                    return siteId === 'lemma.id' || siteId === 'lemma_platform' || !siteId;
                });

            let cred = null;
            if (utils && typeof utils.selectPlatformCredentials === 'function') {
                const validCreds = utils.selectPlatformCredentials(allCredentials);
                cred = validCreds.length > 0 ? validCreds[0] : null;
            } else if (lemmaPermissions.length > 0) {
                cred = lemmaPermissions[0];
            }

            if (cred && utils) {
                const normalized = utils.normalizeCredentialClaims(cred);
                const claims = cred.claims || cred.credentialSubject || {};
                const isLemmaHuman = normalized.isCompleteLemmaId;
                const isDeveloper = normalized.isAdmin
                    || ['customer', 'developer', 'admin'].includes(String(normalized.accountType || '').toLowerCase())
                    || ['admin_access', 'super_admin', 'admin', 'superadmin', 'site_admin'].includes(String(normalized.permissionId || '').toLowerCase());
                if (!isDeveloper && !isLemmaHuman) {
                    cred = null;
                }
            }

            const walletUnlocked = wallet.isUnlocked();
            if (typeof window.setNavLogoUnlocked === 'function') {
                window.setNavLogoUnlocked(walletUnlocked);
            }
            if (cred && walletUnlocked) {
                const normalized = utils ? utils.normalizeCredentialClaims(cred) : null;
                const claims = cred.claims || cred.credentialSubject || {};

                if (localStorage.getItem('lemma_debug_auth') === 'true') {
                    console.log('🔐 Auth: Found credential', { id: cred.id, normalized });
                }

                const userDropdown = document.getElementById('user-dropdown');
                const authButtons = document.getElementById('auth-buttons');
                const publicDashboard = document.getElementById('public-dashboard-link');
                if (isPublicPage) {
                    if (authButtons) authButtons.style.display = 'none';
                    if (publicDashboard) publicDashboard.style.display = 'inline-flex';
                } else {
                    if (userDropdown) userDropdown.style.display = 'block';
                    if (authButtons) authButtons.style.display = 'none';
                }

                const email = normalized?.email || claims.email || 'Customer';
                const accountType = normalized?.accountType || claims.accountType || 'customer';
                const emailElem = document.getElementById('dropdown-email');
                const roleElem = document.getElementById('dropdown-role');
                const avatarInitials = document.getElementById('avatar-initials');
                const userDisplayName = document.getElementById('user-display-name');

                if (emailElem) emailElem.textContent = email;
                if (roleElem) roleElem.textContent = accountType.charAt(0).toUpperCase() + accountType.slice(1);

                if (avatarInitials && email && email !== 'Customer') {
                    const initials = email.split('@')[0].substring(0, 2).toUpperCase();
                    avatarInitials.textContent = initials;
                }

                if (userDisplayName) {
                    const displayName = email && email !== 'Customer'
                        ? email.split('@')[0]
                        : accountType.charAt(0).toUpperCase() + accountType.slice(1);
                    userDisplayName.textContent = displayName;
                }

                const isAdmin = normalized ? normalized.isAdmin : (
                    ['admin_access', 'super_admin', 'admin', 'superadmin', 'site_admin'].includes(claims.permissionId) ||
                    claims.accountType === 'admin'
                );

                const showDeveloperNav = isDeveloperAccount(normalized, claims);
                const devDashboardLink = document.getElementById('dev-dashboard-link');
                const apiKeysLink = document.getElementById('api-keys-link');
                if (devDashboardLink) devDashboardLink.style.display = showDeveloperNav ? 'flex' : 'none';
                if (apiKeysLink) apiKeysLink.style.display = showDeveloperNav ? 'flex' : 'none';

                if (isAdmin) {
                    // Admin UI only needs the wallet-held admin_access lemma
                    // (attached as X-Lemma-Credential). Do not signal-unlock here —
                    // that is cookie/SSO maintenance, not platform auth.
                    const navAdmin = document.getElementById('nav-admin');
                    const adminDropdown = document.getElementById('admin-dropdown-link');
                    if (navAdmin) navAdmin.style.display = 'block';
                    if (adminDropdown) adminDropdown.style.display = 'block';
                }

                const pricingLink = document.getElementById('nav-pricing');
                if (pricingLink && !isPublicPage) pricingLink.style.display = 'none';

                window.lemmaCredential = cred;
                window.lemmaCredentialForHeader = window.buildLemmaCredentialForHeader(cred);
                window.dispatchEvent(new CustomEvent('lemma:credential-ready', {
                    detail: { id: cred.id || null }
                }));

                const auth = new SessionFreeAuth(wallet, {debug: false});
                window.lemmaAuth = auth;
            } else {
                setLoggedOutUI();
            }
        } catch (error) {
            console.warn('🔐 Auth init warning:', error.message);
            if (localStorage.getItem('lemma_debug_auth') === 'true') {
                console.error('🔐 Auth init error details:', error);
            }
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initSessionFreeNav);
    } else {
        initSessionFreeNav();
    }
</script>
