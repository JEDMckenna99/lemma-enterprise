<script nonce="{{ csp_nonce }}">
    (function() {
        if (window.LemmaPlatformAuth) return;

        function isDeveloperPermission(perms, claims) {
            const normalizedClaims = claims || perms?.claims || {};
            const accountType = String(normalizedClaims.accountType || normalizedClaims.account_type || '').toLowerCase();
            const permissionId = String(
                perms?.permissionId
                || normalizedClaims.permissionId
                || normalizedClaims.permission_level
                || normalizedClaims.permission_id
                || ''
            ).toLowerCase();
            const aliases = (perms?.permissionAliases || normalizedClaims.permissionAliases || [])
                .map((value) => String(value).toLowerCase());
            const scope = (perms?.scope || normalizedClaims.scope || [])
                .map((value) => String(value).toLowerCase());

            if (accountType === 'developer') return true;
            if (permissionId === 'developer_access' || permissionId.includes('developer')) return true;
            if (aliases.some((alias) => alias.includes('developer'))) return true;
            if (scope.some((entry) => entry.includes('developer'))) return true;
            if (['admin', 'super_admin', 'superadmin', 'site_admin'].includes(accountType)) return true;
            if (['admin_access', 'super_admin', 'admin', 'superadmin', 'site_admin'].includes(permissionId)) return true;
            return normalizedClaims.isAdmin === true;
        }

        async function checkIsHumanProof(wallet) {
            const utils = window.LemmaCredentialUtils;
            try {
                if (utils && typeof utils.assessLemmaPlatformIdentity === 'function') {
                    const state = await utils.assessLemmaPlatformIdentity(wallet);
                    if (state.completeLemmaId) return true;
                }
                if (typeof wallet.findIsHumanMasterCredential === 'function') {
                    const master = await wallet.findIsHumanMasterCredential();
                    if (master) return true;
                }
                if (typeof wallet.hasIsHumanMasterInCache === 'function') {
                    const cached = await wallet.hasIsHumanMasterInCache();
                    if (cached) return true;
                }
            } catch (_) {
                return false;
            }
            return false;
        }

        async function checkDeveloperPermission(wallet, options) {
            const opts = options || {};
            const tryReissue = opts.tryReissue !== false;

            async function verifyOnce() {
                const perms = await wallet.getVerifiedPermissions('lemma.id');
                return !!(perms?.hasAccess && isDeveloperPermission(perms, perms.claims));
            }

            try {
                if (await verifyOnce()) return true;

                if (!tryReissue || wallet.__lemmaDevPermReissueAttempted) {
                    return false;
                }

                const utils = window.LemmaCredentialUtils;
                let shouldReissue = false;
                if (utils && typeof utils.assessLemmaPlatformIdentity === 'function') {
                    const state = await utils.assessLemmaPlatformIdentity(wallet);
                    shouldReissue = !!(state.unlocked && state.completeLemmaId);
                } else if (typeof wallet.findIsHumanMasterCredential === 'function') {
                    shouldReissue = !!(await wallet.findIsHumanMasterCredential());
                }

                if (!shouldReissue || typeof wallet.reissueMasterCredential !== 'function') {
                    return false;
                }

                wallet.__lemmaDevPermReissueAttempted = true;
                try {
                    await wallet.reissueMasterCredential();
                } catch (err) {
                    if (String(err?.message || err).includes('reissue_rate_limited')) {
                        console.warn('[Lemma] Master reissue rate limited');
                    }
                    return false;
                }
                return await verifyOnce();
            } catch (_) {
                return false;
            }
        }

        async function assessPlatformAuthState(wallet) {
            if (!wallet) {
                return { mode: 'none', hasWallet: false, hasIsHuman: false, hasDeveloper: false };
            }

            await wallet.init();
            const info = await wallet.getWalletInfo();
            const hasWallet = !!(info?.hasPasskey || (info?.lemmaCount > 0));

            if (!hasWallet) {
                return { mode: 'none', hasWallet: false, hasIsHuman: false, hasDeveloper: false };
            }

            if (!wallet.isUnlocked || !wallet.isUnlocked()) {
                return { mode: 'locked', hasWallet: true, hasIsHuman: false, hasDeveloper: false };
            }

            const hasIsHuman = await checkIsHumanProof(wallet);
            const hasDeveloper = await checkDeveloperPermission(wallet);

            if (hasIsHuman) {
                return { mode: 'ready_signin', hasWallet: true, hasIsHuman, hasDeveloper };
            }

            return { mode: 'get_started', hasWallet: true, hasIsHuman, hasDeveloper };
        }

        async function signInPlatformWallet(wallet, options) {
            if (window.__lemmaPlatformSignInInFlight) {
                return null;
            }
            window.__lemmaPlatformSignInInFlight = true;
            try {
            const opts = options || {};
            const redirectUrl = opts.redirectUrl || '/app';

            let passkeyCredentialId = null;
            let clientWalletId = null;

            try {
                passkeyCredentialId = await wallet.getPasskeyCredentialId();
            } catch (_) {}

            try {
                const debugState = await wallet.getDebugState?.() || {};
                const info = await wallet.getWalletInfo();
                clientWalletId = debugState.walletId || info?.walletId || wallet.session?.walletId;
            } catch (_) {}

            if (!clientWalletId) {
                throw new Error('Unlock your wallet with passkey before signing in.');
            }

            const loginHeaders = { 'Content-Type': 'application/json' };
            if (typeof window.getLemmaAuthHeadersAsync === 'function') {
                Object.assign(loginHeaders, await window.getLemmaAuthHeadersAsync());
            } else if (typeof window.getLemmaAuthHeaders === 'function') {
                Object.assign(loginHeaders, window.getLemmaAuthHeaders());
            }

            const response = await fetch('/api/wallet-auth/platform-login', {
                method: 'POST',
                headers: loginHeaders,
                credentials: 'include',
                body: JSON.stringify({
                    passkey_credential_id: passkeyCredentialId,
                    wallet_id: clientWalletId,
                }),
            });

            const result = await response.json();
            if (!result.success) {
                if (result.error === 'platform_membership_required') {
                    const err = new Error('platform_membership_required');
                    err.code = 'platform_membership_required';
                    throw err;
                }
                throw new Error(result.message || result.error || 'Sign in failed');
            }

            if (result.wallet_id && result.wallet_id !== clientWalletId) {
                try {
                    if (wallet._put) {
                        await wallet._put('passkey', { id: 'walletId', value: result.wallet_id });
                    }
                    await fetch('/api/wallet/set-session', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify({
                            wallet_id: result.wallet_id,
                            unlocked_at: Date.now(),
                            profile_id: 'default',
                            profile_name: 'Developer',
                        }),
                    });
                } catch (_) {}
            }

            if (result.permission_lemma) {
                await wallet.storeCredential(result.permission_lemma);
                window.lemmaCredential = result.permission_lemma;
                if (typeof window.buildLemmaCredentialForHeader === 'function') {
                    window.lemmaCredentialForHeader = window.buildLemmaCredentialForHeader(result.permission_lemma);
                }
            }

            if (opts.redirect !== false) {
                window.location.href = redirectUrl;
            }

            return result;
            } finally {
                window.__lemmaPlatformSignInInFlight = false;
            }
        }

        function setNavLogoUnlocked(unlocked) {
            const logo = document.getElementById('nav-logo') || document.querySelector('.nav-logo');
            if (!logo) return;
            const on = !!unlocked;
            logo.classList.toggle('is-unlocked', on);
            logo.setAttribute('data-unlocked', on ? 'true' : 'false');
            logo.title = on ? 'lemma.id unlocked' : 'lemma.id';
        }

        function applyNavAuthButtons(state) {
            const authButtons = document.getElementById('auth-buttons');
            const signInLink = document.getElementById('nav-sign-in-link');
            const getStartedLink = document.getElementById('nav-get-started-link');
            const unlockButton = document.getElementById('nav-unlock-link');
            const unlocked = state.mode === 'ready_signin' || state.mode === 'get_started';
            setNavLogoUnlocked(unlocked);
            if (!authButtons) return;

            if (signInLink) signInLink.style.display = 'none';
            if (getStartedLink) getStartedLink.style.display = 'none';
            if (unlockButton) unlockButton.style.display = 'none';

            if (state.mode === 'ready_signin') {
                authButtons.style.display = 'none';
                return;
            }

            authButtons.style.display = 'flex';

            if (state.mode === 'locked') {
                if (unlockButton) unlockButton.style.display = 'inline-flex';
                return;
            }

            // No wallet yet (or wallet without platform membership): Sign In
            // opens the platform login card. Get Started stays the docs CTA.
            if (signInLink) signInLink.style.display = 'inline-flex';
            if (getStartedLink) getStartedLink.style.display = 'inline-flex';
        }

        async function unlockPlatformWallet(wallet) {
            const unlocked = await wallet.unlock();
            if (!unlocked) {
                throw new Error('Passkey unlock cancelled.');
            }
            return assessPlatformAuthState(wallet);
        }

        async function initNavPlatformAuthCta() {
            if (typeof LemmaWallet === 'undefined') {
                setTimeout(initNavPlatformAuthCta, 50);
                return;
            }

            try {
                if (!window.globalLemmaWallet) {
                    window.globalLemmaWallet = new LemmaWallet({
                        debug: false,
                        enableDeviceSync: true,
                        enableAdvancedFeatures: true,
                    });
                    await window.globalLemmaWallet.init();
                }

                const wallet = window.globalLemmaWallet;
                const state = await assessPlatformAuthState(wallet);
                applyNavAuthButtons(state);

                if (state.mode === 'ready_signin') {
                    setNavLogoUnlocked(true);
                    // Optional platform session for developers who already have
                    // membership; manager access itself does not require it.
                    try {
                        await signInPlatformWallet(wallet, { redirect: false });
                    } catch (_) {}
                    const publicDashboard = document.getElementById('public-dashboard-link');
                    const authButtons = document.getElementById('auth-buttons');
                    if (authButtons) authButtons.style.display = 'none';
                    if (publicDashboard) publicDashboard.style.display = 'inline-flex';
                    window.dispatchEvent(new CustomEvent('lemma:credential-ready', {
                        detail: { source: 'platform_auth_cta' },
                    }));
                    return;
                }

                const unlockButton = document.getElementById('nav-unlock-link');
                if (unlockButton && !unlockButton.dataset.bound) {
                    unlockButton.dataset.bound = '1';
                    unlockButton.addEventListener('click', (event) => {
                        event.preventDefault();
                        window.location.href = '/login';
                    });
                }
            } catch (err) {
                console.warn('[platform-auth-cta] nav init failed:', err?.message || err);
                applyNavAuthButtons({ mode: 'none' });
            }
        }

        window.LemmaPlatformAuth = {
            assess: assessPlatformAuthState,
            signIn: signInPlatformWallet,
            unlock: unlockPlatformWallet,
            applyNavButtons: applyNavAuthButtons,
            setNavLogoUnlocked: setNavLogoUnlocked,
            initNav: initNavPlatformAuthCta,
        };
        window.setNavLogoUnlocked = setNavLogoUnlocked;

        if (document.getElementById('auth-buttons')) {
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initNavPlatformAuthCta);
            } else {
                initNavPlatformAuthCta();
            }
        }
    })();
</script>
