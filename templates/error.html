{% extends "layout.html" %}

{% block title %}{{ error }}{% endblock %}

{% block content %}
<div class="lemma-container">
    <div class="error-page">
        <!-- Error Icon -->
        <div class="error-icon">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <circle cx="12" cy="12" r="10"/>
                <line x1="15" y1="9" x2="9" y2="15"/>
                <line x1="9" y1="9" x2="15" y2="15"/>
            </svg>
        </div>

        <!-- Error Content -->
        <div class="error-content">
            <h1 class="error-title">{{ error }}</h1>
            <p class="error-message">{{ message }}</p>
        </div>

        <!-- Action Buttons -->
        <div class="error-actions">
            <a href="{{ url_for('index') }}" class="btn btn-primary">
                <svg class="btn-arrow-left" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                <span class="btn-text">Return to Home</span>
            </a>
            <button onclick="window.history.back()" class="btn btn-secondary">
                <span class="btn-text">Go Back</span>
            </button>
        </div>

        <!-- Help Section -->
        <div class="error-help">
            <p class="help-title">Need help?</p>
            <div class="help-links">
                <a href="#" class="help-link">Contact Support</a>
                <a href="#" class="help-link">Documentation</a>
                <a href="#" class="help-link">Status Page</a>
            </div>
        </div>
    </div>
</div>

<style>
.error-page {
    max-width: 480px;
    margin: 0 auto;
    padding: var(--spacing-8) var(--spacing-4);
    text-align: center;
    animation: slideInUp 0.6s var(--easing-swift-out);
}

.error-icon {
    display: flex;
    justify-content: center;
    margin-bottom: var(--spacing-6);
}

.error-icon svg {
    color: var(--color-error);
    opacity: 0.8;
}

.error-content {
    margin-bottom: var(--spacing-8);
}

.error-title {
    font-size: var(--font-size-3xl);
    font-weight: var(--font-weight-semibold);
    color: var(--color-gray-900);
    margin-bottom: var(--spacing-3);
    line-height: var(--line-height-tight);
}

.error-message {
    font-size: var(--font-size-lg);
    color: var(--color-gray-600);
    line-height: var(--line-height-relaxed);
    margin: 0;
}

.error-actions {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-3);
    margin-bottom: var(--spacing-8);
}

.btn-arrow-left {
    order: -1;
}

.error-help {
    padding-top: var(--spacing-6);
    border-top: 1px solid var(--color-gray-100);
}

.help-title {
    font-size: var(--font-size-sm);
    font-weight: var(--font-weight-medium);
    color: var(--color-gray-700);
    margin-bottom: var(--spacing-3);
}

.help-links {
    display: flex;
    justify-content: center;
    gap: var(--spacing-4);
    flex-wrap: wrap;
}

.help-link {
    font-size: var(--font-size-sm);
    color: var(--color-primary);
    text-decoration: none;
    font-weight: var(--font-weight-medium);
    transition: color var(--transition-fast) var(--easing-swift-out);
}

.help-link:hover {
    color: var(--color-primary-dark);
    text-decoration: underline;
}

@keyframes slideInUp {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Mobile responsiveness */
@media (max-width: 768px) {
    .error-page {
        padding: var(--spacing-6) var(--spacing-3);
    }
    
    .error-title {
        font-size: var(--font-size-2xl);
    }
    
    .error-message {
        font-size: var(--font-size-base);
    }
    
    .help-links {
        flex-direction: column;
        gap: var(--spacing-2);
    }
}

/* Common error code styling */
.error-page[data-error="404"] .error-icon svg {
    color: var(--color-warning);
}

.error-page[data-error="500"] .error-icon svg {
    color: var(--color-error);
}

.error-page[data-error="403"] .error-icon svg {
    color: var(--color-primary);
}
</style>
{% endblock %}
