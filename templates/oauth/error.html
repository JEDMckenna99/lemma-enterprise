{% extends "modern/layout.html" %}

{% block title %}Authorization Error - Lemma{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 4rem auto; padding: 2rem; text-align: center;">
    <div style="font-size: 4rem; margin-bottom: 1rem;">⚠️</div>
    <h1 style="font-size: 1.5rem; color: #1f2937; margin-bottom: 0.5rem;">Authorization Error</h1>
    <p style="color: #6b7280; margin-bottom: 2rem;">{{ error }}</p>
    <a href="/" style="
        display: inline-block;
        padding: 0.75rem 1.5rem;
        background: #10b981;
        color: white;
        text-decoration: none;
        border-radius: 8px;
        font-weight: 600;
    ">Return to Lemma</a>
</div>
{% endblock %}
