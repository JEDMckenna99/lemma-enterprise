name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest cryptography

      - name: Verify generated tree matches canonical sources
        run: python scripts/build_oss_repo.py --check

      - name: Run five-minute Python demo
        run: python demo/five_minute.py
        working-directory: oss

      - name: Run five-minute Node demo
        run: node demo/five_minute.mjs
        working-directory: oss

      - name: Run protocol fixture tests
        run: pytest tests -q
        working-directory: oss
