[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lemma-proof-verifier"
version = "1.4.0"
description = "Local-first Lemma proof verifier for relying-site backends. Verifies signed presentations, stamps, and site-bound session proofs with no per-request calls to lemma.id."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Lemma", email = "hello@lemma.id" }]
keywords = [
  "lemma",
  "proof-verifier",
  "verifier",
  "ed25519",
  "privacy",
  "ppid",
  "identity",
  "human-verification",
]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security :: Cryptography",
  "Topic :: Internet :: WWW/HTTP",
  "Intended Audience :: Developers",
]
dependencies = [
  "cryptography>=42.0.0",
]

[project.urls]
Homepage = "https://lemma.id/docs"
Documentation = "https://lemma.id/docs"
Repository = "https://github.com/JEDMckenna99/lemma-enterprise"

[tool.setuptools]
py-modules = ["lemma_proof_verifier", "lemma_proof_verifier_site_policy", "lemma_proof_verifier_nonce_store"]
