[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lemma-auth-flask"
version = "0.1.0"
description = "Flask middleware for Lemma credential authentication"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "Flask>=2.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

